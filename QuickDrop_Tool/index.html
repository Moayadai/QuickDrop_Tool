<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tangerine Radial Menu</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Base Layout: Full-screen, transparent background */
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 500x500 Main Viewport */
    .app-canvas {
      position: relative;
      width: 500px;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 380x380 Radial Flower Container */
    .radial-menu {
      position: relative;
      width: 380px;
      height: 380px;
    }

    /* Backdrop element disabled to prevent Linux Skia compositor crashes */
    .glass-petals-backdrop {
      display: none;
    }

    /* SVG Flower Petals Overlay (380x380) */
    .radial-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: auto;
    }

    /* Glass Donut Track: Circular container ring behind all petals */
    .donut-track {
      fill: rgba(255, 255, 255, 0.1);
      stroke: rgba(255, 255, 255, 0.1);
      pointer-events: none;
    }

    /* 3. Milky Frosted Petals: Solid milky frosted white without shadows for safe Linux rendering */
    /* Glass Edges: Subtle, crisp border/stroke of rgba(255, 255, 255, 0.6) */
    .petal-slice {
      fill: rgba(250, 245, 240, 0.85);
      stroke: rgba(255, 255, 255, 0.6);
      stroke-width: 1px;
      cursor: pointer;
      transition: fill 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                  stroke 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 4. Tangerine Hover (Vibrant): Warm, glowing Tangerine Orange */
    .petal-slice.active {
      fill: rgba(255, 100, 0, 0.85);
      stroke: rgba(255, 255, 255, 0.95);
      stroke-width: 1.5px;
    }

    /* Text Contrast: Dark #222 inside unhovered petals for crisp readability */
    .segment-label {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      fill: #222222;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      transition: fill 0.18s ease;
    }

    /* When petal is hovered in glowing Tangerine Orange, text turns crisp white */
    .segment-label.active {
      fill: #ffffff;
      font-weight: 900;
    }

    /* The Center Pill: Simple clean bubble for center dynamic text */
    .center-pill-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 30;
    }

    .center-pill-container.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .center-pill {
      padding: 7px 18px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      max-width: 136px;
    }

    .pill-category {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #ff6400;
      margin-bottom: 2px;
      line-height: 1;
    }

    .pill-action {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #111111;
      text-align: center;
      line-height: 1.15;
    }
  </style>
</head>
<body>
  <div class="app-canvas">
    <!-- 380x380 Flower Radial Menu -->
    <div class="radial-menu" id="radial-menu">
      <!-- 3. Apple Frosted Glass Backdrop (blur: 30px) clipped to the 8 petals -->
      <div class="glass-petals-backdrop"></div>

      <!-- 2. The Center Pill: Frosted glass bubble inside the transparent center hole -->
      <div class="center-pill-container" id="tooltip">
        <div class="center-pill">
          <div class="pill-category" id="tooltip-category">Convert to</div>
          <div class="pill-action" id="tooltip-text">PDF</div>
        </div>
      </div>

      <!-- SVG Flower Petals (380x380) -->
      <svg class="radial-svg" viewBox="0 0 380 380">
        <defs>
          <!-- ClipPath for 8 distinct rounded petals with visible gaps -->
          <clipPath id="petals-clip" clipPathUnits="userSpaceOnUse">
            <path d="M 151.70 34.65 A 160 160 0 0 1 228.30 34.65 A 12 12 0 0 1 236.81 50.11 L 224.17 87.86 A 8 8 0 0 1 214.62 93.08 A 100 100 0 0 0 165.38 93.08 A 8 8 0 0 1 155.83 87.86 L 143.19 50.11 A 12 12 0 0 1 151.70 34.65 Z M 272.77 53.07 A 160 160 0 0 1 326.93 107.23 A 12 12 0 0 1 322.01 124.18 L 286.39 141.94 A 8 8 0 0 1 275.94 138.87 A 100 100 0 0 0 241.13 104.06 A 8 8 0 0 1 238.06 93.61 L 255.82 57.99 A 12 12 0 0 1 272.77 53.07 Z M 345.35 151.70 A 160 160 0 0 1 345.35 228.30 A 12 12 0 0 1 329.89 236.81 L 292.14 224.17 A 8 8 0 0 1 286.92 214.62 A 100 100 0 0 0 286.92 165.38 A 8 8 0 0 1 292.14 155.83 L 329.89 143.19 A 12 12 0 0 1 345.35 151.70 Z M 326.93 272.77 A 160 160 0 0 1 272.77 326.93 A 12 12 0 0 1 255.82 322.01 L 238.06 286.39 A 8 8 0 0 1 241.13 275.94 A 100 100 0 0 0 275.94 241.13 A 8 8 0 0 1 286.39 238.06 L 322.01 255.82 A 12 12 0 0 1 326.93 272.77 Z M 228.30 345.35 A 160 160 0 0 1 151.70 345.35 A 12 12 0 0 1 143.19 329.89 L 155.83 292.14 A 8 8 0 0 1 165.38 286.92 A 100 100 0 0 0 214.62 286.92 A 8 8 0 0 1 224.17 292.14 L 236.81 329.89 A 12 12 0 0 1 228.30 345.35 Z M 107.23 326.93 A 160 160 0 0 1 53.07 272.77 A 12 12 0 0 1 57.99 255.82 L 93.61 238.06 A 8 8 0 0 1 104.06 241.13 A 100 100 0 0 0 138.87 275.94 A 8 8 0 0 1 141.94 286.39 L 124.18 322.01 A 12 12 0 0 1 107.23 326.93 Z M 34.65 228.30 A 160 160 0 0 1 34.65 151.70 A 12 12 0 0 1 50.11 143.19 L 87.86 155.83 A 8 8 0 0 1 93.08 165.38 A 100 100 0 0 0 93.08 214.62 A 8 8 0 0 1 87.86 224.17 L 50.11 236.81 A 12 12 0 0 1 34.65 228.30 Z M 53.07 107.23 A 160 160 0 0 1 107.23 53.07 A 12 12 0 0 1 124.18 57.99 L 141.94 93.61 A 8 8 0 0 1 138.87 104.06 A 100 100 0 0 0 104.06 138.87 A 8 8 0 0 1 93.61 141.94 L 57.99 124.18 A 12 12 0 0 1 53.07 107.23 Z" />
          </clipPath>
        </defs>

        <!-- Glass Donut Track: Translucent circular ring that "holds" the petals -->
        <circle class="donut-track" cx="190" cy="190" r="130" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="108" />

        <!-- 1. 8 Distinct, Separated Flower Petals with Visible Gaps & Rounded Corners -->
        <path id="slice-0" class="petal-slice" data-index="0" data-format="PDF" d="M 151.70 34.65 A 160 160 0 0 1 228.30 34.65 A 12 12 0 0 1 236.81 50.11 L 224.17 87.86 A 8 8 0 0 1 214.62 93.08 A 100 100 0 0 0 165.38 93.08 A 8 8 0 0 1 155.83 87.86 L 143.19 50.11 A 12 12 0 0 1 151.70 34.65 Z" />
        <path id="slice-1" class="petal-slice" data-index="1" data-format="JPG" d="M 272.77 53.07 A 160 160 0 0 1 326.93 107.23 A 12 12 0 0 1 322.01 124.18 L 286.39 141.94 A 8 8 0 0 1 275.94 138.87 A 100 100 0 0 0 241.13 104.06 A 8 8 0 0 1 238.06 93.61 L 255.82 57.99 A 12 12 0 0 1 272.77 53.07 Z" />
        <path id="slice-2" class="petal-slice" data-index="2" data-format="PNG" d="M 345.35 151.70 A 160 160 0 0 1 345.35 228.30 A 12 12 0 0 1 329.89 236.81 L 292.14 224.17 A 8 8 0 0 1 286.92 214.62 A 100 100 0 0 0 286.92 165.38 A 8 8 0 0 1 292.14 155.83 L 329.89 143.19 A 12 12 0 0 1 345.35 151.70 Z" />
        <path id="slice-3" class="petal-slice" data-index="3" data-format="WEBP" d="M 326.93 272.77 A 160 160 0 0 1 272.77 326.93 A 12 12 0 0 1 255.82 322.01 L 238.06 286.39 A 8 8 0 0 1 241.13 275.94 A 100 100 0 0 0 275.94 241.13 A 8 8 0 0 1 286.39 238.06 L 322.01 255.82 A 12 12 0 0 1 326.93 272.77 Z" />
        <path id="slice-4" class="petal-slice" data-index="4" data-format="HEIC" d="M 228.30 345.35 A 160 160 0 0 1 151.70 345.35 A 12 12 0 0 1 143.19 329.89 L 155.83 292.14 A 8 8 0 0 1 165.38 286.92 A 100 100 0 0 0 214.62 286.92 A 8 8 0 0 1 224.17 292.14 L 236.81 329.89 A 12 12 0 0 1 228.30 345.35 Z" />
        <path id="slice-5" class="petal-slice" data-index="5" data-format="TIFF" d="M 107.23 326.93 A 160 160 0 0 1 53.07 272.77 A 12 12 0 0 1 57.99 255.82 L 93.61 238.06 A 8 8 0 0 1 104.06 241.13 A 100 100 0 0 0 138.87 275.94 A 8 8 0 0 1 141.94 286.39 L 124.18 322.01 A 12 12 0 0 1 107.23 326.93 Z" />
        <path id="slice-6" class="petal-slice" data-index="6" data-format="AVIF" d="M 34.65 228.30 A 160 160 0 0 1 34.65 151.70 A 12 12 0 0 1 50.11 143.19 L 87.86 155.83 A 8 8 0 0 1 93.08 165.38 A 100 100 0 0 0 93.08 214.62 A 8 8 0 0 1 87.86 224.17 L 50.11 236.81 A 12 12 0 0 1 34.65 228.30 Z" />
        <path id="slice-7" class="petal-slice" data-index="7" data-format="BMP" d="M 53.07 107.23 A 160 160 0 0 1 107.23 53.07 A 12 12 0 0 1 124.18 57.99 L 141.94 93.61 A 8 8 0 0 1 138.87 104.06 A 100 100 0 0 0 104.06 138.87 A 8 8 0 0 1 93.61 141.94 L 57.99 124.18 A 12 12 0 0 1 53.07 107.23 Z" />

        <!-- Center Pill: Simple clean bubble for dynamic text -->
        <rect id="center-pill-bg" class="center-pill-bg" x="130" y="166" width="120" height="48" rx="15" fill="rgba(255, 255, 255, 0.4)" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1" pointer-events="none" />

        <!-- Petal Labels: Centered in each petal (Rmid = 130px) -->
        <text id="label-0" class="segment-label" x="190.00" y="60.00">PDF</text>
        <text id="label-1" class="segment-label" x="281.92" y="98.08">JPG</text>
        <text id="label-2" class="segment-label" x="320.00" y="190.00">PNG</text>
        <text id="label-3" class="segment-label" x="281.92" y="281.92">WEBP</text>
        <text id="label-4" class="segment-label" x="190.00" y="320.00">HEIC</text>
        <text id="label-5" class="segment-label" x="98.08" y="281.92">TIFF</text>
        <text id="label-6" class="segment-label" x="60.00" y="190.00">AVIF</text>
        <text id="label-7" class="segment-label" x="98.08" y="98.08">BMP</text>
      </svg>
    </div>
  </div>

  <script>
    // Global variable accessible by Python dropEvent
    window.currentHoveredAction = null;

    // 1. Menu Datasets
    const MENUS = {
      DEFAULT: ['PDF', 'JPG', 'PNG', 'WEBP', 'HEIC', 'TIFF', 'AVIF', 'BMP'],
      CTRL:    ['COMPRESS', 'METADATA', 'EDIT', 'REDACT', 'CROP', 'ADD BG', 'WATER', 'RESIZE'],
      SHIFT:   ['ENCRYPT', 'DECRYPT', 'MERGE', 'SPLIT', 'EXTRACT', 'ROTATE', 'FLIP', 'FILTER'],
      ALT:     ['TO ZIP', 'TO TAR', 'TO ISO', 'UNZIP', 'SEND', 'PRINT', 'DELETE', 'INFO']
    };

    let currentModifier = 'DEFAULT';
    let currentHoverIndex = -1;

    /**
     * Updates the center pill text dynamically based on the current active petal.
     */
    function updateTooltipText(index) {
      const label = document.getElementById(`label-${index}`);
      if (!label) {
        window.currentHoveredAction = null;
        return;
      }
      const currentText = label.textContent.trim();
      window.currentHoveredAction = currentText;

      const tooltipText = document.getElementById('tooltip-text');
      const tooltipCategory = document.getElementById('tooltip-category');

      if (tooltipText) {
        tooltipText.textContent = currentText;
      }
      if (tooltipCategory) {
        tooltipCategory.textContent = (currentModifier === 'DEFAULT') ? 'Convert to' : 'Action';
      }
    }

    /**
     * 2. JS Switching Logic: Dynamically updates the textContent of the 8 SVG text elements based on modifier array.
     * @param {string} modifier - 'DEFAULT' | 'CTRL' | 'SHIFT' | 'ALT'
     */
    window.switchMenu = function(modifier) {
      const mod = (modifier || 'DEFAULT').toUpperCase();
      const menuArray = MENUS[mod] || MENUS['DEFAULT'];
      currentModifier = mod;

      for (let i = 0; i < 8; i++) {
        const textEl = document.getElementById(`label-${i}`);
        if (textEl) {
          textEl.textContent = menuArray[i];
        }
        const sliceEl = document.getElementById(`slice-${i}`);
        if (sliceEl) {
          sliceEl.dataset.format = menuArray[i];
        }
      }

      // If a petal is currently hovered, immediately update the center action pill
      if (currentHoverIndex >= 0 && currentHoverIndex < 8) {
        updateTooltipText(currentHoverIndex);
      }
    };

    /**
     * Updates hover state, highlights active petal in glowing Tangerine Orange, and reveals center action pill.
     * @param {number} x - Cursor X coordinate (window space)
     * @param {number} y - Cursor Y coordinate (window space)
     */
    window.updateHover = function(x, y) {
      const menu = document.getElementById('radial-menu');
      if (!menu) return;

      const rect = menu.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const dx = x - cx;
      const dy = y - cy;
      const dist = Math.hypot(dx, dy);

      // Center hole: 76px radius | Outer edge: 184px radius
      if (dist < 76 || dist > 184) {
        window.clearHover();
        return;
      }

      // Calculate angle clockwise from 12 o'clock (North = 0 deg)
      const rad = Math.atan2(dy, dx);
      const deg = (rad * 180 / Math.PI + 90 + 360) % 360;
      const index = Math.floor(((deg + 22.5) % 360) / 45);

      if (index === currentHoverIndex) return;
      currentHoverIndex = index;

      // Update petal hover state (glowing Tangerine Orange)
      for (let i = 0; i < 8; i++) {
        const slice = document.getElementById(`slice-${i}`);
        const label = document.getElementById(`label-${i}`);
        if (i === index) {
          if (slice) slice.classList.add('active');
          if (label) label.classList.add('active');
        } else {
          if (slice) slice.classList.remove('active');
          if (label) label.classList.remove('active');
        }
      }

      // Show active action in glassy center pill
      updateTooltipText(index);
      const tooltip = document.getElementById('tooltip');
      if (tooltip) {
        tooltip.classList.add('visible');
      }
    };

    /**
     * Clears all petal highlights and hides the center action pill.
     */
    window.clearHover = function() {
      window.currentHoveredAction = null;
      if (currentHoverIndex === -1) {
        const tooltip = document.getElementById('tooltip');
        if (tooltip) tooltip.classList.remove('visible');
        return;
      }

      currentHoverIndex = -1;

      for (let i = 0; i < 8; i++) {
        const slice = document.getElementById(`slice-${i}`);
        const label = document.getElementById(`label-${i}`);
        if (slice) slice.classList.remove('active');
        if (label) label.classList.remove('active');
      }

      const tooltip = document.getElementById('tooltip');
      if (tooltip) {
        tooltip.classList.remove('visible');
      }
    };

    // Standard in-page mouse event listeners for browser testing
    window.addEventListener('mousemove', (e) => {
      window.updateHover(e.clientX, e.clientY);
    });

    window.addEventListener('mouseleave', () => {
      window.currentHoveredAction = null;
      window.clearHover();
    });

    // In-page keyboard modifier listeners for browser testing
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Control') window.switchMenu('CTRL');
      else if (e.key === 'Shift') window.switchMenu('SHIFT');
      else if (e.key === 'Alt') window.switchMenu('ALT');
    });

    window.addEventListener('keyup', (e) => {
      if (e.ctrlKey) window.switchMenu('CTRL');
      else if (e.shiftKey) window.switchMenu('SHIFT');
      else if (e.altKey) window.switchMenu('ALT');
      else window.switchMenu('DEFAULT');
      
    });
  </script>
</body>
</html>
