<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tangerine Radial Menu</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 1. Base Layout: Full-screen, transparent background */
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 500x500 Main Viewport */
    .app-canvas {
      position: relative;
      width: 500px;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 6. Floating Tooltip: Pill-shaped div floating ABOVE the ring */
    .floating-tooltip {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-6px) scale(0.96);
      padding: 8px 24px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 
        0 10px 24px rgba(0, 0, 0, 0.16),
        0 2px 6px rgba(0, 0, 0, 0.08),
        inset 0 1px 1.5px rgba(255, 255, 255, 1);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s cubic-bezier(0.16, 1, 0.3, 1), transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      white-space: nowrap;
    }

    .floating-tooltip.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    .tooltip-text {
      font-size: 14px;
      font-weight: 700;
      color: #111111;
      letter-spacing: -0.2px;
    }

    /* 2 & 3. Radial Ring Container (380x380px) */
    .radial-menu {
      position: relative;
      width: 380px;
      height: 380px;
      filter: drop-shadow(0 14px 32px rgba(0, 0, 0, 0.14));
    }

    /* 3. The Radial Ring Base: Light, bright whitish glass (rgba(255, 255, 255, 0.25)) */
    /* Center Hole: CSS clip-path punches out radius 75px, leaving it 100% transparent */
    .glass-ring-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 380px;
      height: 380px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      clip-path: path(evenodd, 'M 190 0 A 190 190 0 1 0 190 380 A 190 190 0 1 0 190 0 M 190 115 A 75 75 0 1 1 190 265 A 75 75 0 1 1 190 115 Z');
      -webkit-clip-path: path(evenodd, 'M 190 0 A 190 190 0 1 0 190 380 A 190 190 0 1 0 190 0 M 190 115 A 75 75 0 1 1 190 265 A 75 75 0 1 1 190 115 Z');
      pointer-events: none;
    }

    /* SVG Segments Overlay (380x380) */
    .radial-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: auto;
    }

    /* 5. Hover State: Solid bright white (rgba(255, 255, 255, 0.95)) */
    .segment-slice {
      fill: rgba(255, 255, 255, 0.001);
      cursor: pointer;
      transition: fill 0.15s ease;
    }

    .segment-slice.active {
      fill: rgba(255, 255, 255, 0.95);
    }

    /* 4. Thin Separators & Circular Borders */
    .separator-line {
      stroke: rgba(255, 255, 255, 0.5);
      stroke-width: 1.5px;
      stroke-linecap: round;
      pointer-events: none;
    }

    .circular-border {
      fill: none;
      stroke: rgba(255, 255, 255, 0.5);
      stroke-width: 1.5px;
      pointer-events: none;
    }

    /* 4. Readability: SVG Text Labels with Dark Bold Visible Text */
    .segment-label {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      fill: #0d0d0f;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      transition: fill 0.15s ease;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.95)) drop-shadow(0 1px 2px rgba(255, 255, 255, 0.9));
    }

    .segment-label.active {
      fill: #000000;
      font-weight: 900;
      filter: none;
    }
  </style>
</head>
<body>
  <div class="app-canvas">
    <!-- 6. Floating Tooltip above the ring -->
    <div class="floating-tooltip" id="tooltip">
      <span class="tooltip-text" id="tooltip-text">Converting to PDF</span>
    </div>

    <!-- 2. The Radial Ring (380x380px) -->
    <div class="radial-menu" id="radial-menu">
      <!-- 2 & 3. Bright Whitish Glass Backdrop with Masked Center Hole -->
      <div class="glass-ring-backdrop"></div>

      <!-- SVG Slices, Separators, and Text Elements (Center: 190, 190 | Outer R: 190 | Inner r: 75) -->
      <svg class="radial-svg" viewBox="0 0 380 380">
        <!-- 3. Base Whitish Glass Ring (rgba(255, 255, 255, 0.25)) -->
        <path class="glass-ring-base" fill="rgba(255, 255, 255, 0.25)" fill-rule="evenodd" d="M 190 0 A 190 190 0 1 0 190 380 A 190 190 0 1 0 190 0 M 190 115 A 75 75 0 1 1 190 265 A 75 75 0 1 1 190 115 Z" />

        <!-- 8 Annular Segments -->
        <path id="slice-0" class="segment-slice" data-index="0" data-format="PDF" d="M 117.29 14.46 A 190 190 0 0 1 262.71 14.46 L 218.70 120.71 A 75 75 0 0 0 161.30 120.71 Z" />
        <path id="slice-1" class="segment-slice" data-index="1" data-format="JPG" d="M 262.71 14.46 A 190 190 0 0 1 365.54 117.29 L 259.29 161.30 A 75 75 0 0 0 218.70 120.71 Z" />
        <path id="slice-2" class="segment-slice" data-index="2" data-format="PNG" d="M 365.54 117.29 A 190 190 0 0 1 365.54 262.71 L 259.29 218.70 A 75 75 0 0 0 259.29 161.30 Z" />
        <path id="slice-3" class="segment-slice" data-index="3" data-format="WEBP" d="M 365.54 262.71 A 190 190 0 0 1 262.71 365.54 L 218.70 259.29 A 75 75 0 0 0 259.29 218.70 Z" />
        <path id="slice-4" class="segment-slice" data-index="4" data-format="HEIC" d="M 262.71 365.54 A 190 190 0 0 1 117.29 365.54 L 161.30 259.29 A 75 75 0 0 0 218.70 259.29 Z" />
        <path id="slice-5" class="segment-slice" data-index="5" data-format="TIFF" d="M 117.29 365.54 A 190 190 0 0 1 14.46 262.71 L 120.71 218.70 A 75 75 0 0 0 161.30 259.29 Z" />
        <path id="slice-6" class="segment-slice" data-index="6" data-format="AVIF" d="M 14.46 262.71 A 190 190 0 0 1 14.46 117.29 L 120.71 161.30 A 75 75 0 0 0 120.71 218.70 Z" />
        <path id="slice-7" class="segment-slice" data-index="7" data-format="BMP" d="M 14.46 117.29 A 190 190 0 0 1 117.29 14.46 L 161.30 120.71 A 75 75 0 0 0 120.71 161.30 Z" />

        <!-- Outer & Inner Circular Borders -->
        <circle cx="190" cy="190" r="190" class="circular-border" />
        <circle cx="190" cy="190" r="75" class="circular-border" />

        <!-- 8 Separators radiating from inner hole (75px) to outer edge (190px) -->
        <line x1="161.30" y1="120.71" x2="117.29" y2="14.46" class="separator-line" />
        <line x1="218.70" y1="120.71" x2="262.71" y2="14.46" class="separator-line" />
        <line x1="259.29" y1="161.30" x2="365.54" y2="117.29" class="separator-line" />
        <line x1="259.29" y1="218.70" x2="365.54" y2="262.71" class="separator-line" />
        <line x1="218.70" y1="259.29" x2="262.71" y2="365.54" class="separator-line" />
        <line x1="161.30" y1="259.29" x2="117.29" y2="365.54" class="separator-line" />
        <line x1="120.71" y1="218.70" x2="14.46" y2="262.71" class="separator-line" />
        <line x1="120.71" y1="161.30" x2="14.46" y2="117.29" class="separator-line" />

        <!-- 1. 8 SVG <text> Elements with IDs label-0 to label-7 (rmid = 132.5) -->
        <text id="label-0" class="segment-label" x="190.00" y="57.50">PDF</text>
        <text id="label-1" class="segment-label" x="283.69" y="96.31">JPG</text>
        <text id="label-2" class="segment-label" x="322.50" y="190.00">PNG</text>
        <text id="label-3" class="segment-label" x="283.69" y="283.69">WEBP</text>
        <text id="label-4" class="segment-label" x="190.00" y="322.50">HEIC</text>
        <text id="label-5" class="segment-label" x="96.31" y="283.69">TIFF</text>
        <text id="label-6" class="segment-label" x="57.50" y="190.00">AVIF</text>
        <text id="label-7" class="segment-label" x="96.31" y="96.31">BMP</text>
      </svg>
    </div>
  </div>

  <script>
    // 1. Menu Datasets
    const MENUS = {
      DEFAULT: ['PDF', 'JPG', 'PNG', 'WEBP', 'HEIC', 'TIFF', 'AVIF', 'BMP'],
      CTRL:    ['COMPRESS', 'METADATA', 'EDIT', 'REDACT', 'CROP', 'ADD BG', 'WATER', 'RESIZE'],
      SHIFT:   ['ENCRYPT', 'DECRYPT', 'MERGE', 'SPLIT', 'EXTRACT', 'ROTATE', 'FLIP', 'FILTER'],
      ALT:     ['TO ZIP', 'TO TAR', 'TO ISO', 'UNZIP', 'SEND', 'PRINT', 'DELETE', 'INFO']
    };

    let currentModifier = 'DEFAULT';
    let currentHoverIndex = -1;

    /**
     * Updates the floating tooltip dynamically based on the current text of the hovered segment.
     */
    function updateTooltipText(index) {
      const label = document.getElementById(`label-${index}`);
      if (!label) return;
      const currentText = label.textContent.trim();
      const tooltipText = document.getElementById('tooltip-text');
      if (!tooltipText) return;

      if (currentModifier === 'DEFAULT') {
        tooltipText.textContent = `Converting to ${currentText}`;
      } else {
        tooltipText.textContent = `Action: ${currentText}`;
      }
    }

    /**
     * 2. JS Switching Logic: Dynamically updates the textContent of the 8 SVG text elements based on modifier array.
     * @param {string} modifier - 'DEFAULT' | 'CTRL' | 'SHIFT' | 'ALT'
     */
    window.switchMenu = function(modifier) {
      const mod = (modifier || 'DEFAULT').toUpperCase();
      const menuArray = MENUS[mod] || MENUS['DEFAULT'];
      currentModifier = mod;

      for (let i = 0; i < 8; i++) {
        const textEl = document.getElementById(`label-${i}`);
        if (textEl) {
          textEl.textContent = menuArray[i];
        }
      }

      // If a segment is currently hovered, immediately update the tooltip text
      if (currentHoverIndex >= 0 && currentHoverIndex < 8) {
        updateTooltipText(currentHoverIndex);
      }
    };

    /**
     * Updates hover state, highlights active segment, and reveals floating tooltip.
     * @param {number} x - Cursor X coordinate (window space)
     * @param {number} y - Cursor Y coordinate (window space)
     */
    window.updateHover = function(x, y) {
      const menu = document.getElementById('radial-menu');
      if (!menu) return;

      const rect = menu.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const dx = x - cx;
      const dy = y - cy;
      const dist = Math.hypot(dx, dy);

      // Center hole: 75px radius | Outer edge: 190px radius
      if (dist < 75 || dist > 190) {
        window.clearHover();
        return;
      }

      // Calculate angle clockwise from 12 o'clock (North = 0 deg)
      const rad = Math.atan2(dy, dx);
      const deg = (rad * 180 / Math.PI + 90 + 360) % 360;
      const index = Math.floor(((deg + 22.5) % 360) / 45);

      if (index === currentHoverIndex) return;
      currentHoverIndex = index;

      // Update segment hover state (solid bright white)
      for (let i = 0; i < 8; i++) {
        const slice = document.getElementById(`slice-${i}`);
        const label = document.getElementById(`label-${i}`);
        if (i === index) {
          if (slice) slice.classList.add('active');
          if (label) label.classList.add('active');
        } else {
          if (slice) slice.classList.remove('active');
          if (label) label.classList.remove('active');
        }
      }

      // Show pill tooltip reading current text dynamically
      updateTooltipText(index);
      const tooltip = document.getElementById('tooltip');
      if (tooltip) {
        tooltip.classList.add('visible');
      }
    };

    /**
     * Clears all segment highlights and hides the tooltip.
     */
    window.clearHover = function() {
      if (currentHoverIndex === -1) {
        const tooltip = document.getElementById('tooltip');
        if (tooltip) tooltip.classList.remove('visible');
        return;
      }

      currentHoverIndex = -1;

      for (let i = 0; i < 8; i++) {
        const slice = document.getElementById(`slice-${i}`);
        const label = document.getElementById(`label-${i}`);
        if (slice) slice.classList.remove('active');
        if (label) label.classList.remove('active');
      }

      const tooltip = document.getElementById('tooltip');
      if (tooltip) {
        tooltip.classList.remove('visible');
      }
    };

    // Standard in-page mouse event listeners for browser testing
    window.addEventListener('mousemove', (e) => {
      window.updateHover(e.clientX, e.clientY);
    });

    window.addEventListener('mouseleave', () => {
      window.clearHover();
    });

    // In-page keyboard modifier listeners for browser testing
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Control') window.switchMenu('CTRL');
      else if (e.key === 'Shift') window.switchMenu('SHIFT');
      else if (e.key === 'Alt') window.switchMenu('ALT');
    });

    window.addEventListener('keyup', (e) => {
      if (e.ctrlKey) window.switchMenu('CTRL');
      else if (e.shiftKey) window.switchMenu('SHIFT');
      else if (e.altKey) window.switchMenu('ALT');
      else window.switchMenu('DEFAULT');
    });
  </script>
</body>
</html>
