<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tangerine Radial Menu</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Base Layout: Full-screen, transparent background */
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 500x500 Main Viewport */
    .app-canvas {
      position: relative;
      width: 500px;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 380x380 Radial Menu Container */
    .radial-menu {
      position: relative;
      width: 380px;
      height: 380px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* True Glassmorphic Donut Backdrop: Frosted glass ring behind all petals */
    .glass-donut-backdrop {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate3d(-50%, -50%, 0);
      width: 352px;
      height: 352px;
      border-radius: 50%;
      -webkit-mask: radial-gradient(circle, transparent 71px, black 72px, black 176px, transparent 177px);
      mask: radial-gradient(circle, transparent 71px, black 72px, black 176px, transparent 177px);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      background: rgba(255, 255, 255, 0.16);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      pointer-events: none;
      z-index: 1;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* SVG Flower Petals Container (380x380) */
    .radial-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      pointer-events: auto;
      z-index: 10;
    }

    /* Glass Donut Track: Translucent circular container ring */
    .donut-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.18);
      stroke-width: 104px;
      pointer-events: none;
    }

    /* Petal Group: Holds slice path and label text */
    .petal-group {
      transform-origin: 190px 190px;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  filter 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      will-change: transform;
      cursor: pointer;
    }

    /* Seamless Wedge Shapes: True continuous arc/wedge slices of the donut */
    .petal-slice {
      fill: rgba(255, 255, 255, 0.25);
      stroke: rgba(255, 255, 255, 0.45);
      stroke-width: 1px;
      stroke-linejoin: round;
      stroke-linecap: round;
      cursor: pointer;
      transition: fill 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  stroke 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  stroke-width 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      will-change: fill, stroke;
    }

    /* Hover Physics: Seamless wedge pop-out scale & vibrant Tangerine orange */
    .petal-group:hover,
    .petal-group.active {
      transform: scale(1.08);
      filter: drop-shadow(0 6px 20px rgba(255, 85, 0, 0.55));
    }

    .petal-group:active {
      transform: scale(0.96) !important;
      transition: transform 0.08s ease !important;
    }

    .petal-group:hover .petal-slice,
    .petal-group.active .petal-slice {
      fill: url(#tangerine-grad) #ff5500;
      stroke: rgba(255, 255, 255, 0.95);
      stroke-width: 1.5px;
    }

    /* Segment Label Inside Wedge Petals */
    .segment-label {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      fill: #1d1d1f;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      transition: fill 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      will-change: fill;
    }

    .segment-label.small-text {
      font-size: 10px;
      letter-spacing: 0.2px;
    }

    .petal-group:hover .segment-label,
    .petal-group.active .segment-label {
      fill: #ffffff;
      font-weight: 900;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3));
    }

    /* True Glassmorphism Center Circle (Native macOS frosted glass hub) */
    .center-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate3d(-50%, -50%, 0) scale(1);
      width: 136px;
      height: 136px;
      border-radius: 50%;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), inset 0 1.5px 2px rgba(255, 255, 255, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 30;
      padding: 10px;
      text-align: center;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      will-change: transform, opacity;
    }

    .center-circle.active {
      transform: translate3d(-50%, -50%, 0) scale(1.04);
      border-color: rgba(255, 255, 255, 0.7);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12), 0 0 24px rgba(255, 85, 0, 0.2), inset 0 1.5px 2px rgba(255, 255, 255, 0.85);
    }

    .pill-category {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #ff5500;
      margin-bottom: 3px;
      line-height: 1;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .pill-action {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #1d1d1f;
      text-align: center;
      line-height: 1.15;
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Menu Switching Spring Animation */
    .menu-switching .petal-group {
      transform: scale(0.95);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="app-canvas">
    <!-- 380x380 Radial Menu Container -->
    <div class="radial-menu" id="radial-menu">
      <!-- Apple Frosted Glass Donut Platter (backdrop-filter: blur(25px)) -->
      <div class="glass-donut-backdrop"></div>

      <!-- Center Circle: Native macOS frosted glass hub -->
      <div class="center-circle center-pill-container center-pill" id="tooltip">
        <div class="pill-category" id="tooltip-category">Convert to</div>
        <div class="pill-action" id="tooltip-text">PDF</div>
      </div>

      <!-- SVG Continuous Donut Ring with 10 Seamless Wedge Slices -->
      <svg class="radial-svg" viewBox="0 0 380 380">
        <defs>
          <linearGradient id="tangerine-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff7300" />
            <stop offset="50%" stop-color="#ff5500" />
            <stop offset="100%" stop-color="#e64200" />
          </linearGradient>
        </defs>

        <!-- Circular Donut Base Track -->
        <circle class="donut-track" cx="190" cy="190" r="124" />

        <!-- 0: PDF (Top / 0°) -->
        <g id="petal-group-0" class="petal-group">
          <path id="slice-0" class="petal-slice petal" data-index="0" data-format="PDF" d="M 168.05 121.43 L 136.34 22.38 A 176.00 176.00 0 0 1 243.66 22.38 L 211.95 121.43 A 72.00 72.00 0 0 0 168.05 121.43 Z" />
          <text id="label-0" class="segment-label" x="190.00" y="66.00">PDF</text>
        </g>

        <!-- 1: DOCX (Top-Right / 36°) -->
        <g id="petal-group-1" class="petal-group">
          <path id="slice-1" class="petal-slice petal" data-index="1" data-format="DOCX" d="M 212.55 121.62 L 245.12 22.85 A 176.00 176.00 0 0 1 331.93 85.93 L 248.06 147.43 A 72.00 72.00 0 0 0 212.55 121.62 Z" />
          <text id="label-1" class="segment-label" x="262.89" y="89.68">DOCX</text>
        </g>

        <!-- 2: TXT (Right-Top / 72°) -->
        <g id="petal-group-2" class="petal-group">
          <path id="slice-2" class="petal-slice petal" data-index="2" data-format="TXT" d="M 248.43 147.93 L 332.84 87.17 A 176.00 176.00 0 0 1 366.00 189.23 L 262.00 189.69 A 72.00 72.00 0 0 0 248.43 147.93 Z" />
          <text id="label-2" class="segment-label" x="307.93" y="151.68">TXT</text>
        </g>

        <!-- 3: JPG (Right-Bottom / 108°) -->
        <g id="petal-group-3" class="petal-group">
          <path id="slice-3" class="petal-slice petal" data-index="3" data-format="JPG" d="M 262.00 190.31 L 366.00 190.77 A 176.00 176.00 0 0 1 332.84 292.83 L 248.43 232.07 A 72.00 72.00 0 0 0 262.00 190.31 Z" />
          <text id="label-3" class="segment-label" x="307.93" y="228.32">JPG</text>
        </g>

        <!-- 4: PNG (Bottom-Right / 144°) -->
        <g id="petal-group-4" class="petal-group">
          <path id="slice-4" class="petal-slice petal" data-index="4" data-format="PNG" d="M 248.06 232.57 L 331.93 294.07 A 176.00 176.00 0 0 1 245.12 357.15 L 212.55 258.38 A 72.00 72.00 0 0 0 248.06 232.57 Z" />
          <text id="label-4" class="segment-label" x="262.89" y="290.32">PNG</text>
        </g>

        <!-- 5: WEBP (Bottom / 180°) -->
        <g id="petal-group-5" class="petal-group">
          <path id="slice-5" class="petal-slice petal" data-index="5" data-format="WEBP" d="M 211.95 258.57 L 243.66 357.62 A 176.00 176.00 0 0 1 136.34 357.62 L 168.05 258.57 A 72.00 72.00 0 0 0 211.95 258.57 Z" />
          <text id="label-5" class="segment-label" x="190.00" y="314.00">WEBP</text>
        </g>

        <!-- 6: HEIC (Bottom-Left / 216°) -->
        <g id="petal-group-6" class="petal-group">
          <path id="slice-6" class="petal-slice petal" data-index="6" data-format="HEIC" d="M 167.45 258.38 L 134.88 357.15 A 176.00 176.00 0 0 1 48.07 294.07 L 131.94 232.57 A 72.00 72.00 0 0 0 167.45 258.38 Z" />
          <text id="label-6" class="segment-label" x="117.11" y="290.32">HEIC</text>
        </g>

        <!-- 7: AVIF (Left-Bottom / 252°) -->
        <g id="petal-group-7" class="petal-group">
          <path id="slice-7" class="petal-slice petal" data-index="7" data-format="AVIF" d="M 131.57 232.07 L 47.16 292.83 A 176.00 176.00 0 0 1 14.00 190.77 L 118.00 190.31 A 72.00 72.00 0 0 0 131.57 232.07 Z" />
          <text id="label-7" class="segment-label" x="72.07" y="228.32">AVIF</text>
        </g>

        <!-- 8: TIFF (Left-Top / 288°) -->
        <g id="petal-group-8" class="petal-group">
          <path id="slice-8" class="petal-slice petal" data-index="8" data-format="TIFF" d="M 118.00 189.69 L 14.00 189.23 A 176.00 176.00 0 0 1 47.16 87.17 L 131.57 147.93 A 72.00 72.00 0 0 0 118.00 189.69 Z" />
          <text id="label-8" class="segment-label" x="72.07" y="151.68">TIFF</text>
        </g>

        <!-- 9: BMP (Top-Left / 324°) -->
        <g id="petal-group-9" class="petal-group">
          <path id="slice-9" class="petal-slice petal" data-index="9" data-format="BMP" d="M 131.94 147.43 L 48.07 85.93 A 176.00 176.00 0 0 1 134.88 22.85 L 167.45 121.62 A 72.00 72.00 0 0 0 131.94 147.43 Z" />
          <text id="label-9" class="segment-label" x="117.11" y="89.68">BMP</text>
        </g>
      </svg>
    </div>
  </div>

  <script>
    // Global variable accessible by Python dropEvent
    window.currentHoveredAction = null;
    window.isProcessing = false;

    // Three UI States matching Tangerine macOS app
    const defaultState = [
      "PDF", "DOCX", "TXT", "JPG", "PNG", "WEBP", "HEIC", "AVIF", "TIFF", "BMP"
    ];
    const ctrlCmdState = [
      "COMPRESS", "CROP", "REDACT", "ADD BG", "METADATA", "EDIT", "ANNOTATE", "WATERMARK", "OCR", "CONVERT"
    ];
    const shiftState = [
      "AIRDROP", "FLOAT", "COPY PATH", "TERMINAL", "SCREENSHOT", "COLOR", "KEEP AWAKE", "RECORD", "TIMER", "CALC"
    ];

    const MENUS = {
      DEFAULT: defaultState,
      CTRL: ctrlCmdState,
      META: ctrlCmdState,
      CMD: ctrlCmdState,
      SHIFT: shiftState
    };

    let currentModifier = 'DEFAULT';
    let currentHoverIndex = -1;

    /**
     * Resets the center circle text to idle state based on active modifier.
     */
    function resetTooltipText() {
      if (window.isProcessing) return;
      const tooltipText = document.getElementById('tooltip-text');
      const tooltipCategory = document.getElementById('tooltip-category');
      if (tooltipCategory) {
        if (currentModifier === 'DEFAULT') {
          tooltipCategory.textContent = 'Convert to';
        } else if (currentModifier === 'SHIFT') {
          tooltipCategory.textContent = 'Utility';
        } else {
          tooltipCategory.textContent = 'Action';
        }
      }
      if (tooltipText) {
        tooltipText.textContent = currentModifier === 'DEFAULT' ? 'PDF' : MENUS[currentModifier][0];
      }
    }

    /**
     * Updates petal text and data-format attributes across all slices.
     * Triggers a subtle macOS spring bounce on modifier change.
     * @param {string[]} stateArray - Array of 10 action strings
     * @param {string} [modifierName] - 'DEFAULT' | 'CTRL' | 'SHIFT'
     */
    function applyPetalsState(stateArray, modifierName) {
      if (modifierName) {
        currentModifier = modifierName;
      }

      // Trigger 60fps spring pop animation on menu switching
      const menu = document.getElementById('radial-menu');
      if (menu) {
        menu.classList.add('menu-switching');
        setTimeout(() => {
          menu.classList.remove('menu-switching');
        }, 350);
      }

      stateArray.forEach((action, index) => {
        const slice = document.getElementById(`slice-${index}`);
        const label = document.getElementById(`label-${index}`);

        if (slice) {
          slice.setAttribute('data-format', action);
          slice.dataset.format = action;
        }

        if (label) {
          label.textContent = action;
          if (action.length > 7) {
            label.classList.add('small-text');
          } else {
            label.classList.remove('small-text');
          }
        }
      });

      // Update center circle dynamically
      if (currentHoverIndex >= 0 && currentHoverIndex < stateArray.length) {
        updateTooltipText(currentHoverIndex);
      } else {
        resetTooltipText();
      }
    }

    /**
     * Updates the center circle text dynamically based on the current active petal.
     * @param {number} index
     */
    function updateTooltipText(index) {
      if (window.isProcessing) return;
      const label = document.getElementById(`label-${index}`);
      if (!label) {
        window.currentHoveredAction = null;
        return;
      }
      const currentText = label.textContent.trim();
      window.currentHoveredAction = currentText;

      const tooltipText = document.getElementById('tooltip-text');
      const tooltipCategory = document.getElementById('tooltip-category');

      if (tooltipText) {
        tooltipText.textContent = currentText;
      }
      if (tooltipCategory) {
        if (currentModifier === 'DEFAULT') {
          tooltipCategory.textContent = 'Convert to';
        } else if (currentModifier === 'SHIFT') {
          tooltipCategory.textContent = 'Utility';
        } else {
          tooltipCategory.textContent = 'Action';
        }
      }
    }

    /**
     * Activates a petal with spring physics, scale(1.08), and vibrant tangerine shift.
     * @param {number} index
     */
    function setActivePetal(index) {
      if (index === currentHoverIndex) return;
      currentHoverIndex = index;

      for (let i = 0; i < 10; i++) {
        const group = document.getElementById(`petal-group-${i}`);
        const slice = document.getElementById(`slice-${i}`);
        const label = document.getElementById(`label-${i}`);
        if (i === index) {
          if (group) group.classList.add('active');
          if (slice) slice.classList.add('active');
          if (label) label.classList.add('active');
        } else {
          if (group) group.classList.remove('active');
          if (slice) slice.classList.remove('active');
          if (label) label.classList.remove('active');
        }
      }

      updateTooltipText(index);

      const tooltip = document.getElementById('tooltip');
      if (tooltip) {
        tooltip.classList.add('active', 'visible');
      }
    }

    /**
     * Switching Logic for Python interop: updates petal states and modifiers.
     * @param {string} modifier - 'DEFAULT' | 'CTRL' | 'META' | 'CMD' | 'SHIFT'
     */
    window.switchMenu = function(modifier) {
      const mod = (modifier || 'DEFAULT').toUpperCase();
      if (mod === 'SHIFT') {
        applyPetalsState(shiftState, 'SHIFT');
      } else if (mod === 'CTRL' || mod === 'META' || mod === 'CMD') {
        applyPetalsState(ctrlCmdState, 'CTRL');
      } else {
        applyPetalsState(defaultState, 'DEFAULT');
      }
    };

    /**
     * Updates hover state, highlights active petal with scale(1.08) & vibrant Tangerine,
     * and springs center frosted glass circle.
     * @param {number} x - Cursor X coordinate (window space)
     * @param {number} y - Cursor Y coordinate (window space)
     */
    window.updateHover = function(x, y) {
      const menu = document.getElementById('radial-menu');
      if (!menu) return;

      const rect = menu.getBoundingClientRect();
      const cx = rect.width ? (rect.left + rect.width / 2) : (window.innerWidth / 2 || 250);
      const cy = rect.height ? (rect.top + rect.height / 2) : (window.innerHeight / 2 || 250);

      const dx = x - cx;
      const dy = y - cy;
      const dist = Math.hypot(dx, dy);

      // Inner hole: 66px radius | Outer radius: 185px radius
      if (dist < 66 || dist > 185) {
        window.clearHover();
        return;
      }

      // Calculate angle clockwise from 12 o'clock (North = 0 deg)
      const rad = Math.atan2(dy, dx);
      const deg = (rad * 180 / Math.PI + 90 + 360) % 360;

      // 10 sectors (36 deg each, centered at 0, 36, 72, 108, 144, 180, 216, 252, 288, 324 deg)
      const index = Math.floor(((deg + 18) % 360) / 36);

      setActivePetal(index);
    };

    /**
     * Clears all petal highlights and resets center hub with spring transition.
     */
    window.clearHover = function() {
      window.currentHoveredAction = null;
      if (currentHoverIndex === -1) return;
      currentHoverIndex = -1;

      for (let i = 0; i < 10; i++) {
        const group = document.getElementById(`petal-group-${i}`);
        const slice = document.getElementById(`slice-${i}`);
        const label = document.getElementById(`label-${i}`);
        if (group) group.classList.remove('active');
        if (slice) slice.classList.remove('active');
        if (label) label.classList.remove('active');
      }

      const tooltip = document.getElementById('tooltip');
      if (tooltip) {
        tooltip.classList.remove('active');
      }
      resetTooltipText();
    };

    /**
     * Dispatches action execution to Python backend on click without requiring file drop.
     * @param {string} action
     */
    function triggerActionIfApplicable(action) {
      if (!action) return;
      const act = action.trim().toUpperCase();
      if (act === 'SCREENSHOT' || act === 'TERMINAL') {
        document.title = 'quickdrop:action:' + act + ':' + Date.now();
      }
    }
    window.triggerAction = triggerActionIfApplicable;

    // Polyfill .click() on SVG elements for programmatic triggering
    if (typeof SVGElement !== 'undefined' && !SVGElement.prototype.click) {
      SVGElement.prototype.click = function() {
        this.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
      };
    }

    // Standard in-page mouse and petal interaction
    for (let i = 0; i < 10; i++) {
      const group = document.getElementById(`petal-group-${i}`);
      const slice = document.getElementById(`slice-${i}`);
      const handlePetalClick = (e) => {
        if (e && e.stopPropagation) e.stopPropagation();
        const label = document.getElementById(`label-${i}`);
        const action = (label ? label.textContent.trim() : '') || window.currentHoveredAction;
        triggerActionIfApplicable(action);
      };

      if (group) {
        group.addEventListener('mouseenter', () => setActivePetal(i));
        group.addEventListener('click', handlePetalClick);
      }
      if (slice && slice !== group) {
        slice.addEventListener('mouseenter', () => setActivePetal(i));
        slice.addEventListener('click', handlePetalClick);
      }
    }

    const radialMenuEl = document.getElementById('radial-menu');
    if (radialMenuEl) {
      radialMenuEl.addEventListener('click', (e) => {
        if (window.currentHoveredAction) {
          triggerActionIfApplicable(window.currentHoveredAction);
        }
      });
    }

    window.addEventListener('mousemove', (e) => {
      window.updateHover(e.clientX, e.clientY);
    });

    window.addEventListener('mouseleave', () => {
      window.clearHover();
    });

    /**
     * Evaluates modifier key state from keyboard event and updates petals accordingly.
     * @param {KeyboardEvent} e
     */
    function syncKeyboardModifiers(e) {
      if (e.shiftKey) {
        if (currentModifier !== 'SHIFT') {
          applyPetalsState(shiftState, 'SHIFT');
        }
      } else if (e.ctrlKey || e.metaKey || (e.type === 'keydown' && (e.key === 'Control' || e.key === 'Meta'))) {
        if (currentModifier !== 'CTRL') {
          applyPetalsState(ctrlCmdState, 'CTRL');
        }
      } else {
        if (currentModifier !== 'DEFAULT') {
          applyPetalsState(defaultState, 'DEFAULT');
        }
      }
    }

    // Global keyboard listeners for Shift, Control, and Meta (Cmd) keys
    window.addEventListener('keydown', (e) => {
      syncKeyboardModifiers(e);
    });

    window.addEventListener('keyup', (e) => {
      syncKeyboardModifiers(e);
    });

    // Reset to default on window blur to avoid stuck modifier
    window.addEventListener('blur', () => {
      if (currentModifier !== 'DEFAULT') {
        applyPetalsState(defaultState, 'DEFAULT');
      }
    });
  </script>
</body>
</html>
