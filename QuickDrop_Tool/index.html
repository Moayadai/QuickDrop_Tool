<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tangerine Radial Menu</title>
  <!-- Premium Icon Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="qwebchannel.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --tangerine: #FF7A00;
      --tangerine-hover: #FF8F1F;
      --tangerine-glow: rgba(255, 122, 0, 0.45);
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.95);
      --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.05);
      --text-dark: #111111;
      --text-muted: #555555;
    }

    /* Base Reset & Transparent Window */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 500x500 Main Viewport */
    .app-canvas {
      position: relative;
      width: 500px;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
    }

    .app-canvas:active {
      cursor: grabbing;
    }

    /* Main Radial Menu Container - Light Frosted Glass Theme */
    .main-container, .radial-menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7) !important;
      backdrop-filter: blur(28px) saturate(200%) !important;
      -webkit-backdrop-filter: blur(28px) saturate(200%) !important;
      border: 1.5px solid rgba(255, 255, 255, 0.95) !important;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.05), inset 0 1px 2px rgba(255, 255, 255, 1) !important;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      transition: box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .radial-menu:active {
      cursor: grabbing;
    }

    /* Frosted Donut Ring Backing */
    .glass-donut-backdrop {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 352px;
      height: 352px;
      border-radius: 50%;
      -webkit-mask: radial-gradient(circle, transparent 71px, black 72px, black 176px, transparent 177px);
      mask: radial-gradient(circle, transparent 71px, black 72px, black 176px, transparent 177px);
      background: rgba(255, 255, 255, 0.75) !important;
      pointer-events: none;
      z-index: 1;
    }

    /* SVG Flower Petals Container (380x380) */
    .radial-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      pointer-events: auto;
      z-index: 10;
    }

    /* Circular Donut Base Track */
    .donut-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.8) !important;
      stroke-width: 104px;
      pointer-events: none;
    }

    /* Petal Group: Holds slice path, icon, and label text */
    .petal-group {
      transform-origin: 190px 190px;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
                  filter 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform, filter;
      cursor: pointer;
    }

    /* Seamless Wedge Shapes: 8 connected macOS-style segments */
    .petal-slice {
      fill: rgba(255, 255, 255, 0.7) !important;
      stroke: rgba(255, 255, 255, 0.95) !important;
      stroke-width: 1.5px !important;
      stroke-linejoin: round;
      cursor: pointer;
      transition: fill 0.15s ease, stroke 0.15s ease;
      will-change: fill, stroke;
    }

    /* Radial Petals / Action Buttons Hover Physics - Vibrant Tangerine Highlight */
    .petal-group:hover,
    .petal-group.active {
      transform: scale(1.048);
      filter: drop-shadow(0 8px 24px rgba(255, 122, 0, 0.6));
    }

    .petal-group:active {
      transform: scale(0.98) !important;
      transition: transform 0.08s ease !important;
    }

    .petal-group:hover .petal-slice,
    .petal-group.active .petal-slice {
      fill: #FF7A00 !important;
      stroke: #ffffff !important;
      stroke-width: 2px !important;
    }

    /* Segment Label Inside Wedge Petals - Dark Gray/Black for High Contrast */
    .segment-label {
      font-size: 11px !important;
      font-weight: 750 !important;
      letter-spacing: 0.35px !important;
      fill: #111111 !important;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      transition: fill 0.15s ease;
      will-change: fill;
      filter: drop-shadow(0 1px 1px rgba(255, 255, 255, 0.9));
    }

    .segment-label.small-text {
      font-size: 9.5px !important;
      font-weight: 750 !important;
      letter-spacing: 0.2px !important;
    }

    .petal-group:hover .segment-label,
    .petal-group.active .segment-label {
      fill: #ffffff !important;
      font-weight: 800 !important;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4)) !important;
    }

    /* Segment Minimalist Icons Inside Wedge Petals - Dark Gray/Black Contrast */
    .petal-icon {
      pointer-events: none;
      color: #111111 !important;
      stroke: #111111 !important;
      fill: none !important;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.95 !important;
      transition: color 0.15s ease, opacity 0.15s ease;
      will-change: color, opacity;
      filter: drop-shadow(0 1px 1px rgba(255, 255, 255, 0.9));
    }

    .petal-group:hover .petal-icon,
    .petal-group.active .petal-icon {
      color: #ffffff !important;
      stroke: #ffffff !important;
      opacity: 1 !important;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4)) !important;
    }

    /* Modern Drop-Target Center Circle (Light Frosted Glass Hub) */
    .center-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 132px;
      height: 132px;
      border-radius: 50%;
      backdrop-filter: blur(25px) saturate(200%) !important;
      -webkit-backdrop-filter: blur(25px) saturate(200%) !important;
      background: rgba(255, 255, 255, 0.85) !important;
      border: 2px dashed rgba(255, 122, 0, 0.5) !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255, 255, 255, 1) !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 30;
      padding: 10px;
      text-align: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform, opacity, box-shadow, border-color;
    }

    .center-circle.active {
      transform: translate(-50%, -50%) scale(1.04);
      border-color: #FF7A00 !important;
      border-style: solid !important;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.1), 0 0 24px rgba(255, 122, 0, 0.45), inset 0 1px 2px rgba(255, 255, 255, 1) !important;
    }

    /* Sleek Drop Target Graphic Inside Center Hub */
    .drop-zone-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin-bottom: 2px;
      pointer-events: none;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
    }

    .drop-target-svg {
      width: 26px;
      height: 26px;
      overflow: visible;
    }

    .target-radar-ring {
      fill: rgba(255, 122, 0, 0.08);
      stroke: #FF7A00;
      stroke-width: 1.5px;
      stroke-dasharray: 4 2.5;
      opacity: 0.85;
      transition: stroke-dasharray 0.2s ease, opacity 0.2s ease, fill 0.2s ease;
    }

    .target-arrow {
      stroke: #FF7A00;
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: transform 0.2s ease;
    }

    .target-base {
      stroke: #FF7A00;
      stroke-width: 2.2px;
      stroke-linecap: round;
      fill: none;
    }

    .center-circle.active .target-radar-ring {
      stroke-dasharray: none;
      opacity: 1;
      fill: rgba(255, 122, 0, 0.16);
    }

    .center-circle.active .target-arrow {
      transform: translateY(1.5px);
    }

    /* Active File Dragging State (macOS Tangerine Drop Focus) */
    body.dragging-file .center-circle {
      transform: translate(-50%, -50%) scale(1.06);
      border-color: #FF7A00 !important;
      border-style: solid !important;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12), 0 0 30px rgba(255, 122, 0, 0.6), inset 0 0 16px rgba(255, 122, 0, 0.2) !important;
    }

    body.dragging-file .target-radar-ring {
      stroke-dasharray: none;
      fill: rgba(255, 122, 0, 0.2);
      opacity: 1;
    }

    body.dragging-file .target-arrow {
      animation: drop-arrow-bounce 0.8s ease-in-out infinite alternate;
    }

    @keyframes drop-arrow-bounce {
      0% { transform: translateY(-1px); }
      100% { transform: translateY(3px); }
    }

    .pill-category {
      font-size: 9.5px !important;
      font-weight: 750 !important;
      letter-spacing: 1.2px !important;
      text-transform: uppercase;
      color: #FF7A00 !important;
      margin-bottom: 2px;
      line-height: 1;
      transition: color 0.15s ease;
    }

    .pill-action {
      font-size: 16px !important;
      font-weight: 800 !important;
      letter-spacing: -0.2px !important;
      color: #111111 !important;
      text-align: center;
      line-height: 1.15;
      max-width: 105px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.15s ease;
    }

    /* Spring Pop Animations */
    @keyframes pampered-spring-pop {
      0% { transform: scale(1); }
      30% { transform: scale(1.15) translateY(-1px); }
      60% { transform: scale(0.96) translateY(0.5px); }
      80% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    @keyframes pampered-pin-wiggle {
      0% { transform: rotate(0deg) scale(1); }
      30% { transform: rotate(-48deg) scale(1.24); }
      60% { transform: rotate(-26deg) scale(1.05); }
      80% { transform: rotate(-37deg) scale(1.1); }
      100% { transform: rotate(-35deg) scale(1); }
    }

    /* Close Window Button - Light Frosted Glass */
    .close-app-btn {
      position: absolute;
      top: 18px;
      left: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      backdrop-filter: blur(25px) !important;
      -webkit-backdrop-filter: blur(25px) !important;
      background: rgba(255, 255, 255, 0.75) !important;
      border: 1px solid rgba(255, 255, 255, 0.95) !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08), inset 0 1px 1px rgba(255, 255, 255, 1);
      color: #111111 !important;
      cursor: pointer;
      z-index: 100;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform, background-color, box-shadow;
    }

    .close-app-btn:hover {
      transform: scale(1.12) rotate(90deg);
      background: rgba(255, 59, 48, 0.95) !important;
      border-color: rgba(255, 255, 255, 0.95) !important;
      color: #ffffff !important;
      box-shadow: 0 6px 20px rgba(255, 59, 48, 0.45) !important;
    }

    .close-app-btn:active {
      transform: scale(0.92) rotate(90deg) !important;
      transition: transform 0.08s ease !important;
    }

    .close-app-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      fill: none;
    }

    /* FLOAT Pin to Top Tool Button - Light Frosted Glass */
    .float-pin-btn {
      position: absolute;
      top: 18px;
      right: 22px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 20px;
      backdrop-filter: blur(25px) !important;
      -webkit-backdrop-filter: blur(25px) !important;
      background: rgba(255, 255, 255, 0.75) !important;
      border: 1px solid rgba(255, 255, 255, 0.95) !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08), inset 0 1px 1px rgba(255, 255, 255, 1);
      color: #111111 !important;
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      cursor: pointer;
      z-index: 100;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform, box-shadow;
    }

    .float-pin-btn:hover {
      transform: scale(1.06) translateY(-1px);
      background: rgba(255, 255, 255, 0.95) !important;
      border-color: rgba(255, 255, 255, 1) !important;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12), inset 0 1px 1px rgba(255, 255, 255, 1);
      color: #000000 !important;
    }

    .float-pin-btn:active {
      transform: scale(0.94) translateY(1px) !important;
      transition: transform 0.08s ease !important;
    }

    .float-pin-btn.pampered-bump {
      animation: pampered-spring-pop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .float-pin-btn.active,
    .float-active {
      background: #FF7A00 !important;
      border-color: rgba(255, 255, 255, 0.95) !important;
      color: #ffffff !important;
      box-shadow: 0 6px 20px rgba(255, 122, 0, 0.45), inset 0 1px 1.5px rgba(255, 255, 255, 0.5) !important;
    }

    .float-pin-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .float-pin-btn.active svg {
      animation: pampered-pin-wiggle 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
  </style>
</head>
<body>
  <div class="app-canvas">
    <!-- Close Window Button -->
    <button id="close-app-btn" class="close-app-btn" title="Close QuickDrop" aria-label="Close QuickDrop" onclick="triggerActionIfApplicable('CLOSE')">
      <svg viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <!-- FLOAT Pin to Top Toggle Button -->
    <button id="float-pin-btn" class="float-pin-btn active float-active" title="Pinned to Top (Click to unpin)" aria-pressed="true" onclick="triggerActionIfApplicable('FLOAT')">
      <svg viewBox="0 0 24 24">
        <path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6l1 1 1-1v-6H18v-2l-2-2z"/>
      </svg>
      <span id="float-pin-label">FLOAT</span>
    </button>

    <!-- Main Radial Menu Container -->
    <div class="radial-menu main-container" id="radial-menu">
      <!-- Apple Light Frosted Glass Donut Platter -->
      <div class="glass-donut-backdrop"></div>

      <!-- Center Circle: Modern Drop Target Hub -->
      <div class="center-circle center-pill-container center-pill" id="tooltip">
        <div class="drop-zone-icon" id="drop-zone-icon">
          <svg class="drop-target-svg" viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="14" class="target-radar-ring" />
            <path d="M16 8.5v11m0 0l-3.5-3.5m3.5 3.5l3.5-3.5" class="target-arrow" />
            <path d="M10 22.5h12" class="target-base" />
          </svg>
        </div>
        <div class="pill-category" id="tooltip-category">Convert to</div>
        <div class="pill-action" id="tooltip-text">PDF</div>
      </div>

      <!-- SVG Continuous Donut Ring with 8 Seamless Wedge Slices -->
      <svg class="radial-svg" viewBox="0 0 380 380">
        <defs>
          <linearGradient id="tangerine-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF9500" />
            <stop offset="45%" stop-color="#FF7A00" />
            <stop offset="100%" stop-color="#FF5100" />
          </linearGradient>

          <!-- ── Action & Tool Icons (Shift State) ── -->
          <symbol id="icon-crop" viewBox="0 0 24 24">
            <path d="M6 2v14a2 2 0 0 0 2 2h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M18 22V8a2 2 0 0 0-2-2H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </symbol>

          <symbol id="icon-redact" viewBox="0 0 24 24">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </symbol>

          <symbol id="icon-compress" viewBox="0 0 24 24">
            <path d="M4 12h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M12 3v6m0 0l-3.5-3.5m3.5 3.5l3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M12 21v-6m0 0l-3.5 3.5m3.5-3.5l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </symbol>

          <symbol id="icon-add-bg" viewBox="0 0 24 24">
            <rect x="3" y="5" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <circle cx="7" cy="9" r="1.2" fill="currentColor"/>
            <path d="M3 14l3.5-3 2.5 2 3-3 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M19 3v6 M16 6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </symbol>

          <symbol id="icon-watermark" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <path d="M7.5 9.5l2 5.5 2.5-4 2.5 4 2-5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </symbol>

          <symbol id="icon-metadata" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <circle cx="12" cy="8" r="1.2" fill="currentColor"/>
            <path d="M12 11.5v5.5m-1 0h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          </symbol>

          <symbol id="icon-edit" viewBox="0 0 24 24">
            <line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="9" cy="7" r="2.5" fill="currentColor"/>
            <circle cx="15" cy="17" r="2.5" fill="currentColor"/>
          </symbol>

          <symbol id="icon-annotate" viewBox="0 0 24 24">
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M3 22h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </symbol>

          <!-- ── Conversion Format Icons (Default State) ── -->
          <symbol id="icon-pdf" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
            <polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
            <path d="M8 14h2a1.5 1.5 0 0 0 0-3H8v5 M13 11v5 M16 11h2a1.5 1.5 0 0 1 0 3h-2v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/>
          </symbol>

          <symbol id="icon-docx" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
            <polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
            <line x1="8" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="8" y1="15" x2="16" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="8" y1="18" x2="13" y2="18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </symbol>

          <symbol id="icon-png" viewBox="0 0 24 24">

  <script>
    // Global variable accessible by Python dropEvent
    window.currentHoveredAction = null;
    window.isProcessing = false;
    window.isFloating = true;

    /**
     * Updates the UI visual state of the FLOAT button.
     */
    function updateFloatVisualState() {
      const pinBtn = document.getElementById('float-pin-btn');
      if (pinBtn) {
        pinBtn.classList.remove('pampered-bump');
        void pinBtn.offsetWidth;
        pinBtn.classList.add('pampered-bump');

        if (window.isFloating) {
          pinBtn.classList.add('active', 'float-active');
          pinBtn.setAttribute('title', 'Pinned to Top (Click to unpin)');
          pinBtn.setAttribute('aria-pressed', 'true');
        } else {
          pinBtn.classList.remove('active', 'float-active');
          pinBtn.setAttribute('title', 'Click to Pin to Top');
          pinBtn.setAttribute('aria-pressed', 'false');
        }
      }
    }

    window.setFloatState = function(floating) {
      window.isFloating = Boolean(floating);
      updateFloatVisualState();
    };

    window.isKeepAwake = false;

    window.setKeepAwakeState = function(awake) {
      window.isKeepAwake = Boolean(awake);
    };

    // ── Tangerine 3 Menus: Default Formats, Shift Tools, Control Utilities ──
    const DEFAULT_FORMATS = [
      "PDF", "DOCX", "PNG", "JPG", "WEBP", "HEIC", "TIFF", "AVIF"
    ];

    const SHIFT_TOOLS = [
      "CROP", "REDACT", "COMPRESS", "ADD BG", "WATERMARK", "METADATA", "EDIT", "ANNOTATE"
    ];

    const CTRL_TOOLS = [
      "AIRDROP", "OCR", "TERMINAL", "SCREENSHOT", "COLOR", "KEEP AWAKE", "RECORD", "FLOAT"
    ];

    // Action-to-Icon identifier dictionary
    const ACTION_ICONS = {
      // Conversion Formats (DEFAULT State)
      "PDF": "icon-pdf",
      "DOCX": "icon-docx",
      "PNG": "icon-png",
      "JPG": "icon-jpg",
      "WEBP": "icon-webp",
      "HEIC": "icon-heic",
      "TIFF": "icon-tiff",
      "AVIF": "icon-avif",

      // Action Tools (Shift State)
      "CROP": "icon-crop",
      "REDACT": "icon-redact",
      "COMPRESS": "icon-compress",
      "ADD BG": "icon-add-bg",
      "WATERMARK": "icon-watermark",
      "METADATA": "icon-metadata",
      "EDIT": "icon-edit",
      "ANNOTATE": "icon-annotate",

      // Utility Tools (Ctrl State)
      "AIRDROP": "icon-airdrop",
      "OCR": "icon-ocr",
      "TERMINAL": "icon-terminal",
      "SCREENSHOT": "icon-screenshot",
      "COLOR": "icon-color",
      "KEEP AWAKE": "icon-keep-awake",
      "AWAKE ☕": "icon-keep-awake",
      "RECORD": "icon-record",
      "FLOAT": "icon-float",
      "FLOAT 📌": "icon-float"
    };

    let currentModifier = 'DEFAULT';
    let currentHoverIndex = -1;
    let isFileDragging = false;

    /**
     * Resets the center circle text based on active modifier.
     */
    function resetTooltipText() {
      if (window.isProcessing) return;
      const tooltipText = document.getElementById('tooltip-text');
      const tooltipCategory = document.getElementById('tooltip-category');
      if (tooltipCategory) {
        if (currentModifier === 'SHIFT') {
          tooltipCategory.textContent = 'Tool';
        } else if (currentModifier === 'CTRL') {
          tooltipCategory.textContent = 'Utility';
        } else {
          tooltipCategory.textContent = 'Convert to';
        }
      }
      if (tooltipText) {
        if (currentModifier === 'SHIFT') {
          tooltipText.textContent = SHIFT_TOOLS[0];
        } else if (currentModifier === 'CTRL') {
          tooltipText.textContent = CTRL_TOOLS[0];
        } else {
          tooltipText.textContent = DEFAULT_FORMATS[0];
        }
      }
    }

    /**
     * Updates petal text and data-format attributes across all 8 slices instantly.
     * @param {string[]} stateArray - Array of 8 action strings
     * @param {string} [modifierName] - 'DEFAULT' | 'SHIFT' | 'CTRL'
     */
    function applyPetalsState(stateArray, modifierName) {
      if (modifierName) {
        currentModifier = modifierName;
      }

      stateArray.forEach((action, index) => {
        const slice = document.getElementById(`slice-${index}`);
        const label = document.getElementById(`label-${index}`);
        const iconUse = document.getElementById(`icon-use-${index}`);

        if (slice) {
          slice.setAttribute('data-format', action);
          slice.dataset.format = action;
        }

        if (label) {
          label.textContent = action;
          if (action.length > 7) {
            label.classList.add('small-text');
          } else {
            label.classList.remove('small-text');
          }
        }

        if (iconUse) {
          const iconId = ACTION_ICONS[action] || 'icon-pdf';
          iconUse.setAttribute('href', `#${iconId}`);
          iconUse.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', `#${iconId}`);
        }
      });

      // Update center circle dynamically
      if (currentHoverIndex >= 0 && currentHoverIndex < stateArray.length) {
        updateTooltipText(currentHoverIndex);
      } else {
        resetTooltipText();
      }
    }

    /**
     * Updates the center circle text dynamically based on the current active petal.
     * @param {number} index
     */
    function updateTooltipText(index) {
      if (window.isProcessing) return;
      const label = document.getElementById(`label-${index}`);
      if (!label) {
        window.currentHoveredAction = null;
        return;
      }
      const currentText = label.textContent.trim();
      window.currentHoveredAction = currentText;

      const tooltipText = document.getElementById('tooltip-text');
      const tooltipCategory = document.getElementById('tooltip-category');

      if (tooltipText) {
        tooltipText.textContent = currentText;
      }
      if (tooltipCategory) {
        if (currentModifier === 'SHIFT') {
          tooltipCategory.textContent = 'Tool';
        } else if (currentModifier === 'CTRL') {
          tooltipCategory.textContent = 'Utility';
        } else {
          tooltipCategory.textContent = 'Convert to';
        }
      }
    }

    // ── Tactile Acoustic Feedback (Web Audio API) ──
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    ['mousedown', 'mousemove', 'keydown', 'touchstart'].forEach((evt) => {
      window.addEventListener(evt, () => {
        try {
          const ctx = getAudioContext();
          if (ctx && ctx.state === 'suspended') {
            ctx.resume();
          }
        } catch (_) {}
      }, { once: true, passive: true });
    });

    function playDialTick() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        if (ctx.state === 'suspended') ctx.resume();

        const t = ctx.currentTime;
        const oscClick = ctx.createOscillator();
        const gainClick = ctx.createGain();
        oscClick.type = 'triangle';
        oscClick.frequency.setValueAtTime(2600, t);
        oscClick.frequency.exponentialRampToValueAtTime(750, t + 0.008);

        gainClick.gain.setValueAtTime(0.04, t);
        gainClick.gain.exponentialRampToValueAtTime(0.0001, t + 0.008);

        oscClick.connect(gainClick);
        gainClick.connect(ctx.destination);
        oscClick.start(t);
        oscClick.stop(t + 0.009);
      } catch (_) {}
    }

    /**
     * Activates a petal with scale and vibrant Tangerine highlight.
     * @param {number} index
     */
    function setActivePetal(index) {
      if (index === currentHoverIndex) return;
      if (index >= 0 && index < 8) {
        playDialTick();
      }
      currentHoverIndex = index;

      for (let i = 0; i < 8; i++) {
        const group = document.getElementById(`petal-group-${i}`);
        const slice = document.getElementById(`slice-${i}`);
        const label = document.getElementById(`label-${i}`);
        if (i === index) {
          if (group) group.classList.add('active');
          if (slice) slice.classList.add('active');
          if (label) label.classList.add('active');
        } else {
          if (group) group.classList.remove('active');
          if (slice) slice.classList.remove('active');
          if (label) label.classList.remove('active');
        }
      }

      updateTooltipText(index);

      const tooltip = document.getElementById('tooltip');
      if (tooltip) {
        tooltip.classList.add('active', 'visible');
      }
    }

    /**
     * Menu Switching for Python backend and JS event interop.
     * @param {string} modifier - 'DEFAULT' | 'SHIFT' | 'CTRL' | 'META' | 'ALT'
     */
    window.switchMenu = function(modifier, force) {
      const mod = (modifier || 'DEFAULT').toUpperCase();
      if (mod === currentModifier && !force) return;
      currentModifier = mod;

      if (mod === 'SHIFT') {
        applyPetalsState(SHIFT_TOOLS, 'SHIFT');
      } else if (mod === 'CTRL' || mod === 'META' || mod === 'CMD' || mod === 'ALT') {
        applyPetalsState(CTRL_TOOLS, 'CTRL');
      } else {
        applyPetalsState(DEFAULT_FORMATS, 'DEFAULT');
      }
    };

    /**
     * Updates hover state across the 8 sectors.
     * @param {number} x - Cursor X coordinate (window space)
     * @param {number} y - Cursor Y coordinate (window space)
     */
    window.updateHover = function(x, y) {
      const menu = document.getElementById('radial-menu');
      if (!menu) return;

      const rect = menu.getBoundingClientRect();
      const cx = rect.width ? (rect.left + rect.width / 2) : (window.innerWidth / 2 || 250);
      const cy = rect.height ? (rect.top + rect.height / 2) : (window.innerHeight / 2 || 250);

      const dx = x - cx;
      const dy = y - cy;
      const dist = Math.hypot(dx, dy);

      // Inner hole: 68px radius | Outer radius: 180px radius
      if (dist < 68 || dist > 180) {
        window.clearHover();
        return;
      }

      // Calculate angle clockwise from 12 o'clock (North = 0 deg)
      const rad = Math.atan2(dy, dx);
      const deg = (rad * 180 / Math.PI + 90 + 360) % 360;

      // 8 sectors (45 deg each, centered at 0, 45, 90, 135, 180, 225, 270, 315 deg)
      const index = Math.floor(((deg + 22.5) % 360) / 45);

      setActivePetal(index);
    };

    /**
     * Clears all petal highlights and resets center drop hub.
     */
    window.clearHover = function() {
      window.currentHoveredAction = null;
      if (currentHoverIndex === -1) return;
      currentHoverIndex = -1;

      for (let i = 0; i < 8; i++) {
        const group = document.getElementById(`petal-group-${i}`);
        const slice = document.getElementById(`slice-${i}`);
        const label = document.getElementById(`label-${i}`);
        if (group) group.classList.remove('active');
        if (slice) slice.classList.remove('active');
        if (label) label.classList.remove('active');
      }

      const tooltip = document.getElementById('tooltip');
      if (tooltip) {
        tooltip.classList.remove('active');
      }
      resetTooltipText();
    };

    // ── Robust Modifier Keys Listener (Shift, Control, Alt, Meta) ──
    function handleModifierKeyEvent(e) {
      if (e.shiftKey || (e.type === 'keydown' && e.key === 'Shift')) {
        window.switchMenu('SHIFT');
      } else if (e.ctrlKey || e.altKey || e.metaKey || (e.type === 'keydown' && (e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta'))) {
        window.switchMenu('CTRL');
      } else {
        window.switchMenu('DEFAULT');
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta') {
        handleModifierKeyEvent(e);
      }
    }, true);

    window.addEventListener('keyup', (e) => {
      if (e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta') {
        handleModifierKeyEvent(e);
      }
    }, true);

    window.addEventListener('blur', () => {
      window.switchMenu('DEFAULT');
    });

    // ── QWebChannel Bridge to Python Backend ──
    var backend = null;
    window.backend = null;
    function initWebChannel() {
      if (window.backend) return;
      if (typeof QWebChannel !== 'undefined' && typeof qt !== 'undefined' && qt.webChannelTransport) {
        new QWebChannel(qt.webChannelTransport, function(channel) {
          backend = channel.objects.backend || channel.objects.bridge;
          window.backend = backend;
          window.bridge = backend;
          console.log("[QuickDrop] QWebChannel connected to Python backend successfully.");
        });
      } else {
        setTimeout(initWebChannel, 50);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initWebChannel);
    } else {
      initWebChannel();
    }

    let lastActionDispatchTime = 0;

    /**
     * Dispatches action execution to Python backend on click without requiring file drop.
     * @param {string} action
     */
    function triggerActionIfApplicable(action) {
      if (!action) return;
      const now = Date.now();
      if (now - lastActionDispatchTime < 350) return;
      lastActionDispatchTime = now;

      const act = action.trim().toUpperCase();

      if (act === 'CLOSE' || act === 'QUIT' || act === 'EXIT') {
        const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
        if (b && typeof b.close_app === 'function') {
          b.close_app();
        } else {
          document.title = 'quickdrop:action:CLOSE:' + Date.now();
        }
        return;
      }

      if (act.startsWith('FLOAT') || act === 'PIN') {
        const nextState = !window.isFloating;
        window.isFloating = nextState;
        updateFloatVisualState();

        const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
        if (b && typeof b.toggle_float_on_top === 'function') {
          b.toggle_float_on_top(Boolean(nextState));
        } else if (b && typeof b.trigger_action === 'function') {
          b.trigger_action(act);
        } else {
          document.title = 'quickdrop:action:FLOAT:' + (nextState ? '1' : '0') + ':' + Date.now();
        }
        return;
      }

      if (act.startsWith('KEEP AWAKE') || act.startsWith('KEEP_AWAKE') || act.startsWith('AWAKE') || act === 'KEEPAWAKE') {
        const nextState = !window.isKeepAwake;
        window.isKeepAwake = nextState;

        const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
        if (b && typeof b.toggleKeepAwake === 'function') {
          b.toggleKeepAwake(function(res) {
            if (typeof window.setKeepAwakeState === 'function') {
              window.setKeepAwakeState(res);
            }
          });
        } else if (b && typeof b.toggle_keep_awake === 'function') {
          b.toggle_keep_awake(function(res) {
            if (typeof window.setKeepAwakeState === 'function') {
              window.setKeepAwakeState(res);
            }
          });
        } else if (b && typeof b.trigger_action === 'function') {
          b.trigger_action('KEEP AWAKE');
        } else {
          document.title = 'quickdrop:action:KEEP AWAKE:' + Date.now();
        }
        return;
      }

      if (act === 'AIRDROP' || act === 'SHARE') {
        const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
        if (b && typeof b.open_file_dialog === 'function') {
          b.open_file_dialog('AIRDROP');
        } else if (b && typeof b.trigger_action === 'function') {
          b.trigger_action('AIRDROP');
        } else {
          document.title = 'quickdrop:action:AIRDROP:' + Date.now();
        }
        return;
      }

      const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
      if (b && typeof b.open_file_dialog === 'function') {
        b.open_file_dialog(act);
      } else if (b && typeof b.trigger_action === 'function') {
        b.trigger_action(act);
      } else {
        document.title = 'quickdrop:action:' + act + ':' + Date.now();
      }
    }
    window.triggerAction = triggerActionIfApplicable;

    // Polyfill .click() on SVG elements
    if (typeof SVGElement !== 'undefined' && !SVGElement.prototype.click) {
      SVGElement.prototype.click = function() {
        this.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
      };
    }

    // ── Window Dragging Bridge (JS to Python) ──
    let isDraggingWindow = false;

    document.addEventListener('mousedown', (e) => {
        const isInteractive = e.target.closest('button') ||
                              e.target.closest('.action-btn') ||
                              e.target.closest('.petal-group') ||
                              e.target.closest('.petal-slice') ||
                              e.target.closest('.petal') ||
                              e.target.closest('.segment-label') ||
                              e.target.closest('.petal-icon') ||
                              e.target.closest('#tooltip');
        if (!isInteractive) {
            isDraggingWindow = true;
            const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
            if (b && b.start_drag) {
                b.start_drag();
            }
        }
    });

    document.addEventListener('mousemove', (e) => {
        if (isDraggingWindow) {
            const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
            if (b && b.do_drag) {
                b.do_drag();
            }
        }
        if (!isDraggingWindow) {
            window.updateHover(e.clientX, e.clientY);
        }
    });

    document.addEventListener('mouseup', () => { 
        if (isDraggingWindow) {
            isDraggingWindow = false;
            const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
            if (b && b.stop_drag) {
                b.stop_drag();
            }
        }
    });

    // Petal interactive click & hover handlers
    for (let i = 0; i < 8; i++) {
      const group = document.getElementById(`petal-group-${i}`);
      const handlePetalClick = (e) => {
        if (e) {
          if (e.stopPropagation) e.stopPropagation();
          if (e.preventDefault) e.preventDefault();
        }
        if (isDraggingWindow) return;
        const sliceEl = document.getElementById(`slice-${i}`);
        const label = document.getElementById(`label-${i}`);
        const action = (sliceEl ? (sliceEl.dataset.format || sliceEl.getAttribute('data-format')) : '')
                      || (label ? label.textContent.trim() : '')
                      || window.currentHoveredAction;
        if (!action) return;
        triggerActionIfApplicable(action);
      };

      if (group) {
        group.addEventListener('mouseenter', () => setActivePetal(i));
        group.addEventListener('click', handlePetalClick);
      }
    }

    const radialMenuEl = document.getElementById('radial-menu');
    if (radialMenuEl) {
      radialMenuEl.addEventListener('click', (e) => {
        if (isDraggingWindow) return;
        if (e.target === radialMenuEl && window.currentHoveredAction) {
          triggerActionIfApplicable(window.currentHoveredAction);
        }
      });
    }

    window.addEventListener('mousemove', (e) => {
      window.updateHover(e.clientX, e.clientY);
    });

    window.addEventListener('mouseleave', () => {
      window.clearHover();
    });

    // ── Drag & Drop Event Listeners ──
    const handleDragEnter = (e) => {
      e.preventDefault();
      isFileDragging = true;
      document.body.classList.add('dragging-file');
      if (e.dataTransfer) {
        e.dataTransfer.dropEffect = 'copy';
      }
      handleModifierKeyEvent(e);
    };

    const handleDragOver = (e) => {
      e.preventDefault();
      isFileDragging = true;
      document.body.classList.add('dragging-file');
      if (e.dataTransfer) {
        e.dataTransfer.dropEffect = 'copy';
      }
      handleModifierKeyEvent(e);
      if (e.clientX !== undefined && e.clientY !== undefined) {
        window.updateHover(e.clientX, e.clientY);
      }
    };

    const handleDragLeave = (e) => {
      e.preventDefault();
      if (!e.relatedTarget || e.clientX <= 0 || e.clientY <= 0 || e.clientX >= window.innerWidth || e.clientY >= window.innerHeight) {
        isFileDragging = false;
        document.body.classList.remove('dragging-file');
        window.clearHover();
        window.switchMenu('DEFAULT');
      }
    };

    const handleDrop = (e) => {
      e.preventDefault();
      isFileDragging = false;
      document.body.classList.remove('dragging-file');
      window.clearHover();
      window.switchMenu('DEFAULT');
    };

    window.addEventListener('dragenter', handleDragEnter, false);
    window.addEventListener('dragover', handleDragOver, false);
    window.addEventListener('dragleave', handleDragLeave, false);
    window.addEventListener('drop', handleDrop, false);

    document.addEventListener('dragenter', handleDragEnter, false);
    document.addEventListener('dragover', handleDragOver, false);
    document.addEventListener('dragleave', handleDragLeave, false);
    document.addEventListener('drop', handleDrop, false);
  </script>
