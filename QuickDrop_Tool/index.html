<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tangerine Radial Menu</title>
  <script src="qwebchannel.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Base Reset & Transparent Window */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 500x500 Main Viewport */
    .app-canvas {
      position: relative;
      width: 500px;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
    }

    .app-canvas:active {
      cursor: grabbing;
    }

    /* Main Radial Menu Container - macOS Glassmorphism */
    .main-container, .radial-menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: rgba(28, 28, 30, 0.72) !important;
      backdrop-filter: blur(40px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(40px) saturate(180%) !important;
      border: 1.5px solid rgba(255, 255, 255, 0.16) !important;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65), inset 0 0 20px rgba(255, 255, 255, 0.05) !important;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .radial-menu:active {
      cursor: grabbing;
    }

    /* Specular Donut Ring inside radial menu */
    .glass-donut-backdrop {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 352px;
      height: 352px;
      border-radius: 50%;
      -webkit-mask: radial-gradient(circle, transparent 71px, black 72px, black 176px, transparent 177px);
      mask: radial-gradient(circle, transparent 71px, black 72px, black 176px, transparent 177px);
      background: rgba(255, 255, 255, 0.04);
      pointer-events: none;
      z-index: 1;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* SVG Flower Petals Container (380x380) */
    .radial-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      pointer-events: auto;
      z-index: 10;
    }

    /* Glass Donut Track: Translucent circular container ring */
    .donut-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.06);
      stroke-width: 104px;
      pointer-events: none;
    }

    /* Petal Group: Holds slice path and label text */
    .petal-group {
      transform-origin: 190px 190px;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
                  filter 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform, filter;
      cursor: pointer;
    }

    /* Seamless Wedge Shapes: Connected pie-chart style segments of the wheel */
    .petal-slice {
      fill: rgba(255, 255, 255, 0.08);
      stroke: rgba(255, 255, 255, 0.22);
      stroke-width: 1.5px;
      stroke-linejoin: round;
      cursor: pointer;
      transition: fill 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
                  stroke 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
                  stroke-width 0.25s ease;
      will-change: fill, stroke;
    }

    /* Radial Petals / Action Buttons Hover Physics */
    .petal-group:hover,
    .petal-group.active {
      transform: scale(1.04);
      filter: drop-shadow(0 6px 20px rgba(255, 85, 0, 0.6));
    }

    .petal-group:active {
      transform: scale(0.98) !important;
      transition: transform 0.08s ease !important;
    }

    .petal-group:hover .petal-slice,
    .petal-group.active .petal-slice {
      fill: url(#tangerine-grad) #ff5500;
      stroke: #ffffff;
      stroke-width: 2px;
    }

    /* Segment Label Inside Wedge Petals */
    .segment-label {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: #f5f5f7;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      transition: fill 0.25s ease;
      will-change: fill;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.6));
    }

    .segment-label.small-text {
      font-size: 10px;
      letter-spacing: 0.2px;
    }

    .petal-group:hover .segment-label,
    .petal-group.active .segment-label {
      fill: #ffffff;
      font-weight: 800;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.8));
    }

    /* True Glassmorphism Center Circle (Native macOS frosted glass hub) */
    .center-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 132px;
      height: 132px;
      border-radius: 50%;
      backdrop-filter: blur(25px) !important;
      -webkit-backdrop-filter: blur(25px) !important;
      background: rgba(20, 20, 22, 0.82) !important;
      border: 1.5px solid rgba(255, 255, 255, 0.18) !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 30;
      padding: 12px;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform, opacity, box-shadow;
    }

    .center-circle.active {
      transform: translate(-50%, -50%) scale(1.04);
      border-color: rgba(255, 122, 0, 0.6) !important;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55), 0 0 24px rgba(255, 85, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.25);
    }

    .pill-category {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #ff7300;
      margin-bottom: 2px;
      line-height: 1;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      transition: color 0.25s ease;
    }

    .pill-action {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #ffffff;
      text-align: center;
      line-height: 1.15;
      max-width: 105px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      transition: color 0.25s ease;
    }

    /* Menu Switching Spring Animation */
    .menu-switching .petal-group {
      transform: scale(0.92);
      opacity: 0.72;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Pampered Spring Pop Animations */
    @keyframes pampered-spring-pop {
      0% { transform: scale(1); }
      30% { transform: scale(1.16) translateY(-1px); }
      60% { transform: scale(0.95) translateY(0.5px); }
      80% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    @keyframes pampered-pin-wiggle {
      0% { transform: rotate(0deg) scale(1); }
      30% { transform: rotate(-48deg) scale(1.24); }
      60% { transform: rotate(-26deg) scale(1.05); }
      80% { transform: rotate(-37deg) scale(1.1); }
      100% { transform: rotate(-35deg) scale(1); }
    }

    /* Close Window Button - Dark Frosted Glass */
    .close-app-btn {
      position: absolute;
      top: 18px;
      left: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      backdrop-filter: blur(25px) !important;
      -webkit-backdrop-filter: blur(25px) !important;
      background: rgba(35, 35, 35, 0.65) !important;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      color: #ffffff;
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform, background-color, box-shadow;
    }

    .close-app-btn:hover {
      transform: scale(1.12) rotate(90deg);
      background: rgba(255, 59, 48, 0.9) !important;
      border-color: rgba(255, 255, 255, 0.8) !important;
      color: #ffffff !important;
      box-shadow: 0 6px 24px rgba(255, 59, 48, 0.6) !important;
    }

    .close-app-btn:active {
      transform: scale(0.92) rotate(90deg) !important;
      transition: transform 0.08s ease !important;
    }

    .close-app-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      fill: none;
      transition: transform 0.3s ease;
    }

    /* FLOAT Pin to Top Tool Button - Dark Frosted Glass */
    .float-pin-btn {
      position: absolute;
      top: 18px;
      right: 22px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 20px;
      backdrop-filter: blur(25px) !important;
      -webkit-backdrop-filter: blur(25px) !important;
      background: rgba(35, 35, 35, 0.65) !important;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      color: #f5f5f7;
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform, box-shadow;
    }

    .float-pin-btn:hover {
      transform: scale(1.06) translateY(-1px);
      background: rgba(55, 55, 55, 0.8) !important;
      border-color: rgba(255, 255, 255, 0.35) !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    .float-pin-btn:active {
      transform: scale(0.94) translateY(1px) !important;
      transition: transform 0.08s ease !important;
    }

    .float-pin-btn.pampered-bump {
      animation: pampered-spring-pop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .float-pin-btn.active,
    .float-active {
      background: linear-gradient(135deg, #FF7A00, #FF5100) !important;
      border-color: rgba(255, 255, 255, 0.8) !important;
      color: #ffffff !important;
      box-shadow: 0 6px 24px rgba(255, 85, 0, 0.6), inset 0 1px 1.5px rgba(255, 255, 255, 0.4) !important;
    }

    .float-pin-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .float-pin-btn.active svg {
      animation: pampered-pin-wiggle 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Petal slice active pinned state */
    .petal-slice.float-active {
      stroke: #ff5500;
      stroke-width: 2.6px;
      fill: rgba(255, 85, 0, 0.28);
    }

    /* Petal slice active keep awake state */
    .petal-slice.awake-active {
      stroke: #ffaa00;
      stroke-width: 2.6px;
      fill: rgba(255, 170, 0, 0.35);
      filter: drop-shadow(0 0 10px rgba(255, 170, 0, 0.8));
    }
  </style>
</head>
<body>
  <div class="app-canvas">
    <!-- Close Window Button -->
    <button id="close-app-btn" class="close-app-btn" title="Close QuickDrop" aria-label="Close QuickDrop" onclick="triggerActionIfApplicable('CLOSE')">
      <svg viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <!-- FLOAT Pin to Top Toggle Button -->
    <button id="float-pin-btn" class="float-pin-btn active float-active" title="Pinned to Top (Click to unpin)" aria-pressed="true" onclick="triggerActionIfApplicable('FLOAT')">
      <svg viewBox="0 0 24 24">
        <path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6l1 1 1-1v-6H18v-2l-2-2z"/>
      </svg>
      <span id="float-pin-label">FLOAT</span>
    </button>
    <!-- Main Radial Menu Container -->
    <div class="radial-menu main-container" id="radial-menu">
      <!-- Apple Frosted Glass Donut Platter (backdrop-filter: blur(25px)) -->
      <div class="glass-donut-backdrop"></div>

      <!-- Center Circle: Native macOS frosted glass hub -->
      <div class="center-circle center-pill-container center-pill" id="tooltip">
        <div class="pill-category" id="tooltip-category">Convert to</div>
        <div class="pill-action" id="tooltip-text">PDF</div>
      </div>

      <!-- SVG Continuous Donut Ring with 10 Seamless Wedge Slices -->
      <svg class="radial-svg" viewBox="0 0 380 380">
        <defs>
          <linearGradient id="tangerine-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff7300" />
            <stop offset="50%" stop-color="#ff5500" />
            <stop offset="100%" stop-color="#e64200" />
          </linearGradient>
        </defs>

        <!-- Circular Donut Base Track -->
        <circle class="donut-track" cx="190" cy="190" r="124" />

        <!-- 0: PDF (Top / 0°) -->
        <g id="petal-group-0" class="petal-group action-btn">
          <path id="slice-0" class="petal-slice petal" data-index="0" data-format="PDF" d="M 167.75 121.52 L 135.61 22.61 A 176.00 176.00 0 0 1 244.39 22.61 L 212.25 121.52 A 72.00 72.00 0 0 0 167.75 121.52 Z" />
          <text id="label-0" class="segment-label" x="190.00" y="66.00">PDF</text>
        </g>

        <!-- 1: DOCX (Top-Right / 36°) -->
        <g id="petal-group-1" class="petal-group action-btn">
          <path id="slice-1" class="petal-slice petal" data-index="1" data-format="DOCX" d="M 212.25 121.52 L 244.39 22.61 A 176.00 176.00 0 0 1 332.39 86.55 L 248.25 147.68 A 72.00 72.00 0 0 0 212.25 121.52 Z" />
          <text id="label-1" class="segment-label" x="262.89" y="89.68">DOCX</text>
        </g>

        <!-- 2: TXT (Right-Top / 72°) -->
        <g id="petal-group-2" class="petal-group action-btn">
          <path id="slice-2" class="petal-slice petal" data-index="2" data-format="TXT" d="M 248.25 147.68 L 332.39 86.55 A 176.00 176.00 0 0 1 366.00 190.00 L 262.00 190.00 A 72.00 72.00 0 0 0 248.25 147.68 Z" />
          <text id="label-2" class="segment-label" x="307.93" y="151.68">TXT</text>
        </g>

        <!-- 3: JPG (Right-Bottom / 108°) -->
        <g id="petal-group-3" class="petal-group action-btn">
          <path id="slice-3" class="petal-slice petal" data-index="3" data-format="JPG" d="M 262.00 190.00 L 366.00 190.00 A 176.00 176.00 0 0 1 332.39 293.45 L 248.25 232.32 A 72.00 72.00 0 0 0 262.00 190.00 Z" />
          <text id="label-3" class="segment-label" x="307.93" y="228.32">JPG</text>
        </g>

        <!-- 4: PNG (Bottom-Right / 144°) -->
        <g id="petal-group-4" class="petal-group action-btn">
          <path id="slice-4" class="petal-slice petal" data-index="4" data-format="PNG" d="M 248.25 232.32 L 332.39 293.45 A 176.00 176.00 0 0 1 244.39 357.39 L 212.25 258.48 A 72.00 72.00 0 0 0 248.25 232.32 Z" />
          <text id="label-4" class="segment-label" x="262.89" y="290.32">PNG</text>
        </g>

        <!-- 5: WEBP (Bottom / 180°) -->
        <g id="petal-group-5" class="petal-group action-btn">
          <path id="slice-5" class="petal-slice petal" data-index="5" data-format="WEBP" d="M 212.25 258.48 L 244.39 357.39 A 176.00 176.00 0 0 1 135.61 357.39 L 167.75 258.48 A 72.00 72.00 0 0 0 212.25 258.48 Z" />
          <text id="label-5" class="segment-label" x="190.00" y="314.00">WEBP</text>
        </g>

        <!-- 6: HEIC (Bottom-Left / 216°) -->
        <g id="petal-group-6" class="petal-group action-btn">
          <path id="slice-6" class="petal-slice petal" data-index="6" data-format="HEIC" d="M 167.75 258.48 L 135.61 357.39 A 176.00 176.00 0 0 1 47.61 293.45 L 131.75 232.32 A 72.00 72.00 0 0 0 167.75 258.48 Z" />
          <text id="label-6" class="segment-label" x="117.11" y="290.32">HEIC</text>
        </g>

        <!-- 7: AVIF (Left-Bottom / 252°) -->
        <g id="petal-group-7" class="petal-group action-btn">
          <path id="slice-7" class="petal-slice petal" data-index="7" data-format="AVIF" d="M 131.75 232.32 L 47.61 293.45 A 176.00 176.00 0 0 1 14.00 190.00 L 118.00 190.00 A 72.00 72.00 0 0 0 131.75 232.32 Z" />
          <text id="label-7" class="segment-label" x="72.07" y="228.32">AVIF</text>
        </g>

        <!-- 8: TIFF (Left-Top / 288°) -->
        <g id="petal-group-8" class="petal-group action-btn">
          <path id="slice-8" class="petal-slice petal" data-index="8" data-format="TIFF" d="M 118.00 190.00 L 14.00 190.00 A 176.00 176.00 0 0 1 47.61 86.55 L 131.75 147.68 A 72.00 72.00 0 0 0 118.00 190.00 Z" />
          <text id="label-8" class="segment-label" x="72.07" y="151.68">TIFF</text>
        </g>

        <!-- 9: BMP (Top-Left / 324°) -->
        <g id="petal-group-9" class="petal-group action-btn">
          <path id="slice-9" class="petal-slice petal" data-index="9" data-format="BMP" d="M 131.75 147.68 L 47.61 86.55 A 176.00 176.00 0 0 1 135.61 22.61 L 167.75 121.52 A 72.00 72.00 0 0 0 131.75 147.68 Z" />
          <text id="label-9" class="segment-label" x="117.11" y="89.68">BMP</text>
        </g>
      </svg>
    </div>
  </div>

  <script>
    // Global variable accessible by Python dropEvent
    window.currentHoveredAction = null;
    window.isProcessing = false;
    window.isFloating = true;

    /**
     * Updates the UI visual state of the FLOAT button and petal.
     */
    function updateFloatVisualState() {
      const pinBtn = document.getElementById('float-pin-btn');
      if (pinBtn) {
        // Trigger pampered bounce animation
        pinBtn.classList.remove('pampered-bump');
        void pinBtn.offsetWidth;
        pinBtn.classList.add('pampered-bump');

        if (window.isFloating) {
          pinBtn.classList.add('active');
          pinBtn.classList.add('float-active');
          pinBtn.setAttribute('title', 'Pinned to Top (Click to unpin)');
          pinBtn.setAttribute('aria-pressed', 'true');
        } else {
          pinBtn.classList.remove('active');
          pinBtn.classList.remove('float-active');
          pinBtn.setAttribute('title', 'Click to Pin to Top');
          pinBtn.setAttribute('aria-pressed', 'false');
        }
      }

      // Update petal slice 1 if currently in SHIFT menu
      const slice1 = document.getElementById('slice-1');
      const label1 = document.getElementById('label-1');
      if (currentModifier === 'SHIFT') {
        if (slice1) {
          if (window.isFloating) {
            slice1.classList.add('float-active');
          } else {
            slice1.classList.remove('float-active');
          }
        }
        if (label1) {
          label1.textContent = window.isFloating ? 'FLOAT 📌' : 'FLOAT';
        }
      }
    }

    /**
     * Called from Python backend to synchronize pin-to-top floating state.
     * @param {boolean} floating
     */
    window.setFloatState = function(floating) {
      window.isFloating = Boolean(floating);
      updateFloatVisualState();
    };

    window.isKeepAwake = false;

    function updateKeepAwakeVisualState() {
      const slice6 = document.getElementById('slice-6');
      const label6 = document.getElementById('label-6');
      if (currentModifier === 'SHIFT') {
        if (slice6) {
          if (window.isKeepAwake) {
            slice6.classList.add('awake-active');
            slice6.style.fill = '#ffaa00';
            slice6.style.stroke = '#ffffff';
            slice6.style.strokeWidth = '2px';
            slice6.style.filter = 'drop-shadow(0 0 12px rgba(255, 170, 0, 0.9))';
          } else {
            slice6.classList.remove('awake-active');
            slice6.style.fill = '';
            slice6.style.stroke = '';
            slice6.style.strokeWidth = '';
            slice6.style.filter = '';
          }
        }
        if (label6) {
          label6.textContent = window.isKeepAwake ? 'AWAKE ☕' : 'KEEP AWAKE';
        }
      }
    }

    window.setKeepAwakeState = function(awake) {
      window.isKeepAwake = Boolean(awake);
      updateKeepAwakeVisualState();
    };

    // Three UI States matching Tangerine macOS app
    const defaultState = [
      "PDF", "DOCX", "TXT", "JPG", "PNG", "WEBP", "HEIC", "AVIF", "TIFF", "BMP"
    ];
    const ctrlCmdState = [
      "COMPRESS", "CROP", "REDACT", "ADD BG", "METADATA", "EDIT", "ANNOTATE", "WATERMARK", "OCR", "CONVERT"
    ];
    const shiftState = [
      "AIRDROP", "FLOAT", "COPY PATH", "TERMINAL", "SCREENSHOT", "COLOR", "KEEP AWAKE", "RECORD", "TIMER", "CALC"
    ];

    const MENUS = {
      DEFAULT: defaultState,
      CTRL: ctrlCmdState,
      META: ctrlCmdState,
      CMD: ctrlCmdState,
      SHIFT: shiftState
    };

    let currentModifier = 'DEFAULT';
    let currentHoverIndex = -1;
    let isFileDragging = false;
    let isCtrlPressed = false;
    let isShiftPressed = false;

    /**
     * Resets the center circle text to idle state based on active modifier.
     */
    function resetTooltipText() {
      if (window.isProcessing) return;
      const tooltipText = document.getElementById('tooltip-text');
      const tooltipCategory = document.getElementById('tooltip-category');
      if (tooltipCategory) {
        if (currentModifier === 'DEFAULT') {
          tooltipCategory.textContent = 'Convert to';
        } else if (currentModifier === 'SHIFT') {
          tooltipCategory.textContent = 'Utility';
        } else {
          tooltipCategory.textContent = 'Action';
        }
      }
      if (tooltipText) {
        tooltipText.textContent = currentModifier === 'DEFAULT' ? 'PDF' : MENUS[currentModifier][0];
      }
    }

    /**
     * Updates petal text and data-format attributes across all slices.
     * Triggers a subtle macOS spring bounce on modifier change.
     * @param {string[]} stateArray - Array of 10 action strings
     * @param {string} [modifierName] - 'DEFAULT' | 'CTRL' | 'SHIFT'
     */
    function applyPetalsState(stateArray, modifierName) {
      if (modifierName) {
        currentModifier = modifierName;
      }

      // Trigger 60fps spring pop animation on menu switching
      const menu = document.getElementById('radial-menu');
      if (menu) {
        menu.classList.add('menu-switching');
        setTimeout(() => {
          menu.classList.remove('menu-switching');
        }, 350);
      }

      stateArray.forEach((action, index) => {
        const slice = document.getElementById(`slice-${index}`);
        const label = document.getElementById(`label-${index}`);

        if (slice) {
          slice.setAttribute('data-format', action);
          slice.dataset.format = action;
        }

        if (label) {
          label.textContent = action;
          if (action.length > 7) {
            label.classList.add('small-text');
          } else {
            label.classList.remove('small-text');
          }
        }
      });

      // Synchronize float visual state on petals
      updateFloatVisualState();
      updateKeepAwakeVisualState();

      // Update center circle dynamically
      if (currentHoverIndex >= 0 && currentHoverIndex < stateArray.length) {
        updateTooltipText(currentHoverIndex);
      } else {
        resetTooltipText();
      }
    }

    /**
     * Updates the center circle text dynamically based on the current active petal.
     * @param {number} index
     */
    function updateTooltipText(index) {
      if (window.isProcessing) return;
      const label = document.getElementById(`label-${index}`);
      if (!label) {
        window.currentHoveredAction = null;
        return;
      }
      const currentText = label.textContent.trim();
      window.currentHoveredAction = currentText;

      const tooltipText = document.getElementById('tooltip-text');
      const tooltipCategory = document.getElementById('tooltip-category');

      if (tooltipText) {
        tooltipText.textContent = currentText;
      }
      if (tooltipCategory) {
        if (currentModifier === 'DEFAULT') {
          tooltipCategory.textContent = 'Convert to';
        } else if (currentModifier === 'SHIFT') {
          tooltipCategory.textContent = 'Utility';
        } else {
          tooltipCategory.textContent = 'Action';
        }
      }
    }

    // ── Premium Acoustic Feedback (Web Audio API Synthesizer) ──
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Pre-unlock audio context on user gesture to eliminate any audio latency
    ['mousedown', 'mousemove', 'keydown', 'touchstart'].forEach((evt) => {
      window.addEventListener(evt, () => {
        try {
          const ctx = getAudioContext();
          if (ctx && ctx.state === 'suspended') {
            ctx.resume();
          }
        } catch (_) {}
      }, { once: true, passive: true });
    });

    /**
     * Synthesizes an ultra-subtle, tactile mechanical tick (watch escapement / luxury dial feel).
     * Zero audio asset latency, pure mathematical audio synthesis.
     */
    function playDialTick() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        if (ctx.state === 'suspended') {
          ctx.resume();
        }

        const t = ctx.currentTime;

        // Layer 1: High transient mechanical click snap (triangle wave, rapid pitch sweep)
        const oscClick = ctx.createOscillator();
        const gainClick = ctx.createGain();
        oscClick.type = 'triangle';
        oscClick.frequency.setValueAtTime(2400, t);
        oscClick.frequency.exponentialRampToValueAtTime(700, t + 0.008);

        gainClick.gain.setValueAtTime(0.04, t);
        gainClick.gain.exponentialRampToValueAtTime(0.0001, t + 0.008);

        oscClick.connect(gainClick);
        gainClick.connect(ctx.destination);

        oscClick.start(t);
        oscClick.stop(t + 0.009);

        // Layer 2: Subtle acoustic body damping (sine wave, mechanical precision resonance)
        const oscBody = ctx.createOscillator();
        const gainBody = ctx.createGain();
        oscBody.type = 'sine';
        oscBody.frequency.setValueAtTime(1300, t);
        oscBody.frequency.exponentialRampToValueAtTime(350, t + 0.013);

        gainBody.gain.setValueAtTime(0.03, t);
        gainBody.gain.exponentialRampToValueAtTime(0.0001, t + 0.013);

        oscBody.connect(gainBody);
        gainBody.connect(ctx.destination);

        oscBody.start(t);
        oscBody.stop(t + 0.014);
      } catch (_) {
        // Safe no-op if audio context is blocked or unavailable
      }
    }

    /**
     * Activates a petal with spring physics, scale(1.08), and vibrant tangerine shift.
     * @param {number} index
     */
    function setActivePetal(index) {
      if (index === currentHoverIndex) return;
      if (index >= 0 && index < 10) {
        playDialTick();
      }
      currentHoverIndex = index;

      for (let i = 0; i < 10; i++) {
        const group = document.getElementById(`petal-group-${i}`);
        const slice = document.getElementById(`slice-${i}`);
        const label = document.getElementById(`label-${i}`);
        if (i === index) {
          if (group) group.classList.add('active');
          if (slice) slice.classList.add('active');
          if (label) label.classList.add('active');
        } else {
          if (group) group.classList.remove('active');
          if (slice) slice.classList.remove('active');
          if (label) label.classList.remove('active');
        }
      }

      updateTooltipText(index);

      const tooltip = document.getElementById('tooltip');
      if (tooltip) {
        tooltip.classList.add('active', 'visible');
      }
    }

    /**
     * Switching Logic for Python interop: updates petal states and modifiers.
     * @param {string} modifier - 'DEFAULT' | 'CTRL' | 'META' | 'CMD' | 'SHIFT'
     */
    window.switchMenu = function(modifier) {
      const mod = (modifier || 'DEFAULT').toUpperCase();
      if (mod === 'SHIFT') {
        applyPetalsState(shiftState, 'SHIFT');
      } else if (mod === 'CTRL' || mod === 'META' || mod === 'CMD') {
        applyPetalsState(ctrlCmdState, 'CTRL');
      } else {
        applyPetalsState(defaultState, 'DEFAULT');
      }
    };

    /**
     * Updates hover state, highlights active petal with scale(1.08) & vibrant Tangerine,
     * and springs center frosted glass circle.
     * @param {number} x - Cursor X coordinate (window space)
     * @param {number} y - Cursor Y coordinate (window space)
     */
    window.updateHover = function(x, y) {
      const menu = document.getElementById('radial-menu');
      if (!menu) return;

      const rect = menu.getBoundingClientRect();
      const cx = rect.width ? (rect.left + rect.width / 2) : (window.innerWidth / 2 || 250);
      const cy = rect.height ? (rect.top + rect.height / 2) : (window.innerHeight / 2 || 250);

      const dx = x - cx;
      const dy = y - cy;
      const dist = Math.hypot(dx, dy);

      // Inner hole: 66px radius | Outer radius: 182px radius
      if (dist < 66 || dist > 182) {
        window.clearHover();
        return;
      }

      // Calculate angle clockwise from 12 o'clock (North = 0 deg)
      const rad = Math.atan2(dy, dx);
      const deg = (rad * 180 / Math.PI + 90 + 360) % 360;

      // 10 sectors (36 deg each, centered at 0, 36, 72, 108, 144, 180, 216, 252, 288, 324 deg)
      const index = Math.floor(((deg + 18) % 360) / 36);

      setActivePetal(index);
    };

    /**
     * Clears all petal highlights and resets center hub with spring transition.
     */
    window.clearHover = function() {
      window.currentHoveredAction = null;
      if (currentHoverIndex === -1) return;
      currentHoverIndex = -1;

      for (let i = 0; i < 10; i++) {
        const group = document.getElementById(`petal-group-${i}`);
        const slice = document.getElementById(`slice-${i}`);
        const label = document.getElementById(`label-${i}`);
        if (group) group.classList.remove('active');
        if (slice) slice.classList.remove('active');
        if (label) label.classList.remove('active');
      }

      const tooltip = document.getElementById('tooltip');
      if (tooltip) {
        tooltip.classList.remove('active');
      }
      resetTooltipText();
    };

    // Initialize QWebChannel bridge to Python backend
    var backend = null;
    window.backend = null;
    function initWebChannel() {
      if (window.backend) return;
      if (typeof QWebChannel !== 'undefined' && typeof qt !== 'undefined' && qt.webChannelTransport) {
        new QWebChannel(qt.webChannelTransport, function(channel) {
          backend = channel.objects.backend || channel.objects.bridge;
          window.backend = backend;
          window.bridge = backend;
          console.log("[QuickDrop] QWebChannel connected to Python backend successfully.");
        });
      } else {
        setTimeout(initWebChannel, 50);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initWebChannel);
    } else {
      initWebChannel();
    }

    let lastActionDispatchTime = 0;

    /**
     * Dispatches action execution to Python backend on click without requiring file drop.
     * @param {string} action
     */
    function triggerActionIfApplicable(action) {
      if (!action) return;
      const now = Date.now();
      if (now - lastActionDispatchTime < 350) return;
      lastActionDispatchTime = now;

      const act = action.trim().toUpperCase();

      if (act === 'CLOSE' || act === 'QUIT' || act === 'EXIT') {
        const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
        if (b && typeof b.close_app === 'function') {
          b.close_app();
        } else {
          document.title = 'quickdrop:action:CLOSE:' + Date.now();
        }
        return;
      }

      if (act.startsWith('FLOAT') || act === 'PIN') {
        const nextState = !window.isFloating;
        // Pampered immediate tactile UI feedback
        window.isFloating = nextState;
        updateFloatVisualState();

        const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
        if (b && typeof b.toggle_float_on_top === 'function') {
          b.toggle_float_on_top(Boolean(nextState));
        } else if (b && typeof b.trigger_action === 'function') {
          b.trigger_action(act);
        } else {
          document.title = 'quickdrop:action:FLOAT:' + (nextState ? '1' : '0') + ':' + Date.now();
        }
        return;
      }

      if (act.startsWith('KEEP AWAKE') || act.startsWith('KEEP_AWAKE') || act.startsWith('AWAKE') || act === 'KEEPAWAKE') {
        const nextState = !window.isKeepAwake;
        window.isKeepAwake = nextState;
        updateKeepAwakeVisualState();

        const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
        if (b && typeof b.toggleKeepAwake === 'function') {
          b.toggleKeepAwake(function(res) {
            if (typeof window.setKeepAwakeState === 'function') {
              window.setKeepAwakeState(res);
            }
          });
        } else if (b && typeof b.toggle_keep_awake === 'function') {
          b.toggle_keep_awake(function(res) {
            if (typeof window.setKeepAwakeState === 'function') {
              window.setKeepAwakeState(res);
            }
          });
        } else if (b && typeof b.trigger_action === 'function') {
          b.trigger_action('KEEP AWAKE');
        } else {
          document.title = 'quickdrop:action:KEEP AWAKE:' + Date.now();
        }
        return;
      }

      if (act === 'SCREENSHOT' || act === 'CALC' || act === 'TIMER' || act === 'RECORD' || act === 'TERMINAL') {
        const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
        if (b && typeof b.trigger_action === 'function') {
          b.trigger_action(act);
        } else {
          document.title = 'quickdrop:action:' + act + ':' + Date.now();
        }
        return;
      }

      const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
      if (b && typeof b.open_file_dialog === 'function') {
        b.open_file_dialog(act);
      } else if (b && typeof b.trigger_action === 'function') {
        b.trigger_action(act);
      } else {
        document.title = 'quickdrop:action:' + act + ':' + Date.now();
      }
    }
    window.triggerAction = triggerActionIfApplicable;

    // Polyfill .click() on SVG elements for programmatic triggering
    if (typeof SVGElement !== 'undefined' && !SVGElement.prototype.click) {
      SVGElement.prototype.click = function() {
        this.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
      };
    }

    // ── Bulletproof Window Dragging (JS-to-Python Coordinate Bridge) ──
    let isDraggingWindow = false;

    document.addEventListener('mousedown', (e) => {
        const isInteractive = e.target.closest('button') ||
                              e.target.closest('.action-btn') ||
                              e.target.closest('.petal-group') ||
                              e.target.closest('.petal-slice') ||
                              e.target.closest('.petal') ||
                              e.target.closest('.segment-label');
        if (!isInteractive) {
            isDraggingWindow = true;
            const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
            if (b && b.start_drag) {
                b.start_drag();
            }
        }
    });

    document.addEventListener('mousemove', (e) => {
        if (isDraggingWindow) {
            const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
            if (b && b.do_drag) {
                b.do_drag();
            }
        }
        if (!isDraggingWindow) {
            window.updateHover(e.clientX, e.clientY);
        }
    });

    document.addEventListener('mouseup', () => { 
        if (isDraggingWindow) {
            isDraggingWindow = false;
            const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
            if (b && b.stop_drag) {
                b.stop_drag();
            }
        }
    });

    // Standard in-page mouse and petal interaction
    for (let i = 0; i < 10; i++) {
      const group = document.getElementById(`petal-group-${i}`);
      const slice = document.getElementById(`slice-${i}`);
      const handlePetalClick = (e) => {
        if (e) {
          if (e.stopPropagation) e.stopPropagation();
          if (e.preventDefault) e.preventDefault();
        }
        if (isDraggingWindow) return;
        const sliceEl = document.getElementById(`slice-${i}`);
        const label = document.getElementById(`label-${i}`);
        const action = (sliceEl ? (sliceEl.dataset.format || sliceEl.getAttribute('data-format')) : '')
                      || (label ? label.textContent.trim() : '')
                      || window.currentHoveredAction;
        if (!action) return;
        triggerActionIfApplicable(action);
      };

      if (group) {
        group.addEventListener('mouseenter', () => setActivePetal(i));
        group.addEventListener('click', handlePetalClick);
      }
    }

    const radialMenuEl = document.getElementById('radial-menu');
    if (radialMenuEl) {
      radialMenuEl.addEventListener('click', (e) => {
        if (isDraggingWindow) return;
        if (e.target === radialMenuEl && window.currentHoveredAction) {
          triggerActionIfApplicable(window.currentHoveredAction);
        }
      });
    }

    window.addEventListener('mousemove', (e) => {
      window.updateHover(e.clientX, e.clientY);
    });

    window.addEventListener('mouseleave', () => {
      window.clearHover();
    });

    // Global keyboard listeners: Control and Shift act as TOGGLES, Space resets to Default
    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;

      if (e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        applyPetalsState(defaultState, 'DEFAULT');
        return;
      }

      if (e.key === 'Control' || e.key === 'Meta') {
        if (currentModifier === 'CTRL') {
          applyPetalsState(defaultState, 'DEFAULT');
        } else {
          applyPetalsState(ctrlCmdState, 'CTRL');
        }
        return;
      }

      if (e.key === 'Shift') {
        if (currentModifier === 'SHIFT') {
          applyPetalsState(defaultState, 'DEFAULT');
        } else {
          applyPetalsState(shiftState, 'SHIFT');
        }
        return;
      }
    });

    // Remove keyup resets for Ctrl/Shift (toggles stay active until toggled or Space pressed)
    window.addEventListener('keyup', (e) => {
      // Intentionally empty: no keyup resets for Ctrl or Shift
    });

    // Window blur listener: do NOT reset toggled modifier menus on blur
    window.addEventListener('blur', () => {
      // Toggle state persists across window blur and app focus transitions
    });

    // ── Drag & Drop Event Listeners (OS file drag-over preserves toggled menus) ──
    const handleDragEnter = (e) => {
      e.preventDefault();
      isFileDragging = true;
      if (e.dataTransfer) {
        e.dataTransfer.dropEffect = 'copy';
      }
    };

    const handleDragOver = (e) => {
      e.preventDefault();
      isFileDragging = true;
      if (e.dataTransfer) {
        e.dataTransfer.dropEffect = 'copy';
      }
      if (e.clientX !== undefined && e.clientY !== undefined) {
        window.updateHover(e.clientX, e.clientY);
      }
    };

    const handleDragLeave = (e) => {
      e.preventDefault();
      if (!e.relatedTarget || e.clientX <= 0 || e.clientY <= 0 || e.clientX >= window.innerWidth || e.clientY >= window.innerHeight) {
        isFileDragging = false;
        window.clearHover();
      }
    };

    const handleDrop = (e) => {
      e.preventDefault();
      isFileDragging = false;
      window.clearHover();
    };

    window.addEventListener('dragenter', handleDragEnter, false);
    window.addEventListener('dragover', handleDragOver, false);
    window.addEventListener('dragleave', handleDragLeave, false);
    window.addEventListener('drop', handleDrop, false);

    document.addEventListener('dragenter', handleDragEnter, false);
    document.addEventListener('dragover', handleDragOver, false);
    document.addEventListener('dragleave', handleDragLeave, false);
    document.addEventListener('drop', handleDrop, false);
  </script>
</body>
