<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tangerine Radial Menu</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Base Layout: Full-screen, transparent background */
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 500x500 Main Viewport */
    .app-canvas {
      position: relative;
      width: 500px;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 380x380 Radial Flower Container */
    .radial-menu {
      position: relative;
      width: 380px;
      height: 380px;
    }

    /* Backdrop element disabled to prevent Linux Skia compositor crashes */
    .glass-petals-backdrop {
      display: none;
    }

    /* SVG Flower Petals Overlay (380x380) */
    .radial-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: auto;
    }

    /* Glass Donut Track: Circular container ring behind all petals */
    .donut-track {
      fill: rgba(255, 255, 255, 0.1);
      stroke: rgba(255, 255, 255, 0.1);
      pointer-events: none;
    }

    /* 3. Milky Frosted Petals: Solid milky frosted white without shadows for safe Linux rendering */
    /* Glass Edges: Subtle, crisp border/stroke of rgba(255, 255, 255, 0.6) */
    .petal-slice {
      fill: rgba(250, 245, 240, 0.85);
      stroke: rgba(255, 255, 255, 0.6);
      stroke-width: 1px;
      cursor: pointer;
      transition: fill 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                  stroke 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 4. Tangerine Hover (Vibrant): Warm, glowing Tangerine Orange */
    .petal-slice.active {
      fill: rgba(255, 100, 0, 0.85);
      stroke: rgba(255, 255, 255, 0.95);
      stroke-width: 1.5px;
    }

    /* Text Contrast: Dark #222 inside unhovered petals for crisp readability */
    .segment-label {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      fill: #222222;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      transition: fill 0.18s ease;
    }

    /* When petal is hovered in glowing Tangerine Orange, text turns crisp white */
    .segment-label.active {
      fill: #ffffff;
      font-weight: 900;
    }

    /* The Center Pill: Simple clean bubble for center dynamic text */
    .center-pill-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 30;
    }

    .center-pill-container.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .center-pill {
      padding: 7px 18px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      max-width: 136px;
    }

    .pill-category {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #ff6400;
      margin-bottom: 2px;
      line-height: 1;
    }

    .pill-action {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #111111;
      text-align: center;
      line-height: 1.15;
    }
  </style>
</head>
<body>
  <div class="app-canvas">
    <!-- 380x380 Flower Radial Menu -->
    <div class="radial-menu" id="radial-menu">
      <!-- 3. Apple Frosted Glass Backdrop (blur: 30px) clipped to the 8 petals -->
      <div class="glass-petals-backdrop"></div>

      <!-- 2. The Center Pill: Frosted glass bubble inside the transparent center hole -->
      <div class="center-pill-container" id="tooltip">
        <div class="center-pill">
          <div class="pill-category" id="tooltip-category">Convert to</div>
          <div class="pill-action" id="tooltip-text">PDF</div>
        </div>
      </div>

      <!-- SVG Flower Petals (380x380) -->
      <svg class="radial-svg" viewBox="0 0 380 380">
        <defs>
          <!-- ClipPath for 8 distinct rounded petals with visible gaps -->
          <clipPath id="petals-clip" clipPathUnits="userSpaceOnUse">
            <path d="M 138.41 21.73 A 176 176 0 0 1 241.59 21.73 A 10 10 0 0 1 248.03 34.79 L 222.15 104.01 A 6 6 0 0 1 214.80 107.65 A 86 86 0 0 0 165.20 107.65 A 6 6 0 0 1 157.85 104.01 L 131.97 34.79 A 10 10 0 0 1 138.41 21.73 Z M 272.50 34.53 A 176 176 0 0 1 345.47 107.50 A 10 10 0 0 1 340.78 121.29 L 273.54 151.93 A 6 6 0 0 1 265.76 149.31 A 86 86 0 0 0 230.69 114.24 A 6 6 0 0 1 228.07 106.46 L 258.71 39.22 A 10 10 0 0 1 272.50 34.53 Z M 358.27 138.41 A 176 176 0 0 1 358.27 241.59 A 10 10 0 0 1 345.21 248.03 L 275.99 222.15 A 6 6 0 0 1 272.35 214.80 A 86 86 0 0 0 272.35 165.20 A 6 6 0 0 1 275.99 157.85 L 345.21 131.97 A 10 10 0 0 1 358.27 138.41 Z M 345.47 272.50 A 176 176 0 0 1 272.50 345.47 A 10 10 0 0 1 258.71 340.78 L 228.07 273.54 A 6 6 0 0 1 230.69 265.76 A 86 86 0 0 0 265.76 230.69 A 6 6 0 0 1 273.54 228.07 L 340.78 258.71 A 10 10 0 0 1 345.47 272.50 Z M 241.59 358.27 A 176 176 0 0 1 138.41 358.27 A 10 10 0 0 1 131.97 345.21 L 157.85 275.99 A 6 6 0 0 1 165.20 272.35 A 86 86 0 0 0 214.80 272.35 A 6 6 0 0 1 222.15 275.99 L 248.03 345.21 A 10 10 0 0 1 241.59 358.27 Z M 107.50 345.47 A 176 176 0 0 1 34.53 272.50 A 10 10 0 0 1 39.22 258.71 L 106.46 228.07 A 6 6 0 0 1 114.24 230.69 A 86 86 0 0 0 149.31 265.76 A 6 6 0 0 1 151.93 273.54 L 121.29 340.78 A 10 10 0 0 1 107.50 345.47 Z M 21.73 241.59 A 176 176 0 0 1 21.73 138.41 A 10 10 0 0 1 34.79 131.97 L 104.01 157.85 A 6 6 0 0 1 107.65 165.20 A 86 86 0 0 0 107.65 214.80 A 6 6 0 0 1 104.01 222.15 L 34.79 248.03 A 10 10 0 0 1 21.73 241.59 Z M 34.53 107.50 A 176 176 0 0 1 107.50 34.53 A 10 10 0 0 1 121.29 39.22 L 151.93 106.46 A 6 6 0 0 1 149.31 114.24 A 86 86 0 0 0 114.24 149.31 A 6 6 0 0 1 106.46 151.93 L 39.22 121.29 A 10 10 0 0 1 34.53 107.50 Z" />
          </clipPath>
        </defs>

        <!-- Glass Donut Track: Translucent circular ring that "holds" the petals -->
        <circle class="donut-track" cx="190" cy="190" r="130" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="108" />

        <!-- 1. 8 Distinct, Separated Flower Petals with Visible Gaps & Rounded Corners -->
        <path id="slice-0" class="petal-slice" data-index="0" data-format="PDF" d="M 138.41 21.73 A 176 176 0 0 1 241.59 21.73 A 10 10 0 0 1 248.03 34.79 L 222.15 104.01 A 6 6 0 0 1 214.80 107.65 A 86 86 0 0 0 165.20 107.65 A 6 6 0 0 1 157.85 104.01 L 131.97 34.79 A 10 10 0 0 1 138.41 21.73 Z" />
        <path id="slice-1" class="petal-slice" data-index="1" data-format="JPG" d="M 272.50 34.53 A 176 176 0 0 1 345.47 107.50 A 10 10 0 0 1 340.78 121.29 L 273.54 151.93 A 6 6 0 0 1 265.76 149.31 A 86 86 0 0 0 230.69 114.24 A 6 6 0 0 1 228.07 106.46 L 258.71 39.22 A 10 10 0 0 1 272.50 34.53 Z" />
        <path id="slice-2" class="petal-slice" data-index="2" data-format="PNG" d="M 358.27 138.41 A 176 176 0 0 1 358.27 241.59 A 10 10 0 0 1 345.21 248.03 L 275.99 222.15 A 6 6 0 0 1 272.35 214.80 A 86 86 0 0 0 272.35 165.20 A 6 6 0 0 1 275.99 157.85 L 345.21 131.97 A 10 10 0 0 1 358.27 138.41 Z" />
        <path id="slice-3" class="petal-slice" data-index="3" data-format="WEBP" d="M 345.47 272.50 A 176 176 0 0 1 272.50 345.47 A 10 10 0 0 1 258.71 340.78 L 228.07 273.54 A 6 6 0 0 1 230.69 265.76 A 86 86 0 0 0 265.76 230.69 A 6 6 0 0 1 273.54 228.07 L 340.78 258.71 A 10 10 0 0 1 345.47 272.50 Z" />
        <path id="slice-4" class="petal-slice" data-index="4" data-format="HEIC" d="M 241.59 358.27 A 176 176 0 0 1 138.41 358.27 A 10 10 0 0 1 131.97 345.21 L 157.85 275.99 A 6 6 0 0 1 165.20 272.35 A 86 86 0 0 0 214.80 272.35 A 6 6 0 0 1 222.15 275.99 L 248.03 345.21 A 10 10 0 0 1 241.59 358.27 Z" />
        <path id="slice-5" class="petal-slice" data-index="5" data-format="TIFF" d="M 107.50 345.47 A 176 176 0 0 1 34.53 272.50 A 10 10 0 0 1 39.22 258.71 L 106.46 228.07 A 6 6 0 0 1 114.24 230.69 A 86 86 0 0 0 149.31 265.76 A 6 6 0 0 1 151.93 273.54 L 121.29 340.78 A 10 10 0 0 1 107.50 345.47 Z" />
        <path id="slice-6" class="petal-slice" data-index="6" data-format="AVIF" d="M 21.73 241.59 A 176 176 0 0 1 21.73 138.41 A 10 10 0 0 1 34.79 131.97 L 104.01 157.85 A 6 6 0 0 1 107.65 165.20 A 86 86 0 0 0 107.65 214.80 A 6 6 0 0 1 104.01 222.15 L 34.79 248.03 A 10 10 0 0 1 21.73 241.59 Z" />
        <path id="slice-7" class="petal-slice" data-index="7" data-format="BMP" d="M 34.53 107.50 A 176 176 0 0 1 107.50 34.53 A 10 10 0 0 1 121.29 39.22 L 151.93 106.46 A 6 6 0 0 1 149.31 114.24 A 86 86 0 0 0 114.24 149.31 A 6 6 0 0 1 106.46 151.93 L 39.22 121.29 A 10 10 0 0 1 34.53 107.50 Z" />

        <!-- Center Pill: Simple clean bubble for dynamic text -->
        <rect id="center-pill-bg" class="center-pill-bg" x="130" y="166" width="120" height="48" rx="15" fill="rgba(255, 255, 255, 0.4)" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1" pointer-events="none" />

        <!-- Petal Labels: Centered in each petal (Rmid = 130px) -->
        <text id="label-0" class="segment-label" x="190.00" y="60.00">PDF</text>
        <text id="label-1" class="segment-label" x="281.92" y="98.08">JPG</text>
        <text id="label-2" class="segment-label" x="320.00" y="190.00">PNG</text>
        <text id="label-3" class="segment-label" x="281.92" y="281.92">WEBP</text>
        <text id="label-4" class="segment-label" x="190.00" y="320.00">HEIC</text>
        <text id="label-5" class="segment-label" x="98.08" y="281.92">TIFF</text>
        <text id="label-6" class="segment-label" x="60.00" y="190.00">AVIF</text>
        <text id="label-7" class="segment-label" x="98.08" y="98.08">BMP</text>
      </svg>
    </div>
  </div>

  <script>
    // Global variable accessible by Python dropEvent
    window.currentHoveredAction = null;

    // 1. Three UI States for the Petals
    const defaultState = ["PDF", "JPG", "PNG", "WEBP", "HEIC", "TIFF", "AVIF", "BMP"];
    const ctrlCmdState = ["COMPRESS", "CROP", "REDACT", "ADD BG", "METADATA", "EDIT", "ANNOTATE", "WATERMARK"];
    const shiftState   = ["TERMINAL", "SCREENSHOT", "FLOAT", "COLOR", "KEEP AWAKE", "RECORD", "TIMER", "CALC"];

    const MENUS = {
      DEFAULT: defaultState,
      CTRL: ctrlCmdState,
      META: ctrlCmdState,
      CMD: ctrlCmdState,
      SHIFT: shiftState
    };

    let currentModifier = 'DEFAULT';
    let currentHoverIndex = -1;

    /**
     * Updates petal text and data-format attributes across all .petal-slice elements.
     * @param {string[]} stateArray - Array of 8 action strings
     * @param {string} [modifierName] - 'DEFAULT' | 'CTRL' | 'SHIFT'
     */
    function applyPetalsState(stateArray, modifierName) {
      if (modifierName) {
        currentModifier = modifierName;
      }
      const slices = document.querySelectorAll('.petal-slice');
      slices.forEach((slice, index) => {
        if (index >= stateArray.length) return;
        const action = stateArray[index];

        // Update data-format attribute (used by drag-and-drop logic)
        slice.setAttribute('data-format', action);
        slice.dataset.format = action;

        // Update <text> content
        const label = document.getElementById(`label-${index}`) || slice.querySelector('text');
        if (label) {
          label.textContent = action;
        }
      });

      // Immediately update center action pill and window.currentHoveredAction if hovered
      if (currentHoverIndex >= 0 && currentHoverIndex < 8) {
        updateTooltipText(currentHoverIndex);
      }
    }

    /**
     * Updates the center pill text dynamically based on the current active petal.
     */
    function updateTooltipText(index) {
      const label = document.getElementById(`label-${index}`);
      if (!label) {
        window.currentHoveredAction = null;
        return;
      }
      const currentText = label.textContent.trim();
      window.currentHoveredAction = currentText;

      const tooltipText = document.getElementById('tooltip-text');
      const tooltipCategory = document.getElementById('tooltip-category');

      if (tooltipText) {
        tooltipText.textContent = currentText;
      }
      if (tooltipCategory) {
        if (currentModifier === 'DEFAULT') {
          tooltipCategory.textContent = 'Convert to';
        } else if (currentModifier === 'SHIFT') {
          tooltipCategory.textContent = 'Utility';
        } else {
          tooltipCategory.textContent = 'Action';
        }
      }
    }

    /**
     * Switching Logic for Python interop: updates petal states and modifiers.
     * @param {string} modifier - 'DEFAULT' | 'CTRL' | 'META' | 'CMD' | 'SHIFT'
     */
    window.switchMenu = function(modifier) {
      const mod = (modifier || 'DEFAULT').toUpperCase();
      if (mod === 'SHIFT') {
        applyPetalsState(shiftState, 'SHIFT');
      } else if (mod === 'CTRL' || mod === 'META' || mod === 'CMD') {
        applyPetalsState(ctrlCmdState, 'CTRL');
      } else {
        applyPetalsState(defaultState, 'DEFAULT');
      }
    };

    /**
     * Updates hover state, highlights active petal in glowing Tangerine Orange, and reveals center action pill.
     * @param {number} x - Cursor X coordinate (window space)
     * @param {number} y - Cursor Y coordinate (window space)
     */
    window.updateHover = function(x, y) {
      const menu = document.getElementById('radial-menu');
      if (!menu) return;

      const rect = menu.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const dx = x - cx;
      const dy = y - cy;
      const dist = Math.hypot(dx, dy);

      // Center hole: 76px radius | Outer edge: 184px radius
      if (dist < 76 || dist > 184) {
        window.clearHover();
        return;
      }

      // Calculate angle clockwise from 12 o'clock (North = 0 deg)
      const rad = Math.atan2(dy, dx);
      const deg = (rad * 180 / Math.PI + 90 + 360) % 360;
      const index = Math.floor(((deg + 22.5) % 360) / 45);

      if (index === currentHoverIndex) return;
      currentHoverIndex = index;

      // Update petal hover state (glowing Tangerine Orange)
      for (let i = 0; i < 8; i++) {
        const slice = document.getElementById(`slice-${i}`);
        const label = document.getElementById(`label-${i}`);
        if (i === index) {
          if (slice) slice.classList.add('active');
          if (label) label.classList.add('active');
        } else {
          if (slice) slice.classList.remove('active');
          if (label) label.classList.remove('active');
        }
      }

      // Show active action in glassy center pill
      updateTooltipText(index);
      const tooltip = document.getElementById('tooltip');
      if (tooltip) {
        tooltip.classList.add('visible');
      }
    };

    /**
     * Clears all petal highlights and hides the center action pill.
     */
    window.clearHover = function() {
      window.currentHoveredAction = null;
      if (currentHoverIndex === -1) {
        const tooltip = document.getElementById('tooltip');
        if (tooltip) tooltip.classList.remove('visible');
        return;
      }

      currentHoverIndex = -1;

      for (let i = 0; i < 8; i++) {
        const slice = document.getElementById(`slice-${i}`);
        const label = document.getElementById(`label-${i}`);
        if (slice) slice.classList.remove('active');
        if (label) label.classList.remove('active');
      }

      const tooltip = document.getElementById('tooltip');
      if (tooltip) {
        tooltip.classList.remove('visible');
      }
    };

    // Standard in-page mouse event listeners
    window.addEventListener('mousemove', (e) => {
      window.updateHover(e.clientX, e.clientY);
    });

    window.addEventListener('mouseleave', () => {
      window.currentHoveredAction = null;
      window.clearHover();
    });

    /**
     * Evaluates modifier key state from keyboard event and updates petals accordingly.
     * @param {KeyboardEvent} e
     */
    function syncKeyboardModifiers(e) {
      if (e.shiftKey) {
        if (currentModifier !== 'SHIFT') {
          applyPetalsState(shiftState, 'SHIFT');
        }
      } else if (e.ctrlKey || e.metaKey || (e.type === 'keydown' && (e.key === 'Control' || e.key === 'Meta'))) {
        if (currentModifier !== 'CTRL') {
          applyPetalsState(ctrlCmdState, 'CTRL');
        }
      } else {
        if (currentModifier !== 'DEFAULT') {
          applyPetalsState(defaultState, 'DEFAULT');
        }
      }
    }

    // Global keyboard listeners for Shift, Control, and Meta (Cmd) keys
    window.addEventListener('keydown', (e) => {
      syncKeyboardModifiers(e);
    });

    window.addEventListener('keyup', (e) => {
      syncKeyboardModifiers(e);
    });

    // Reset to default on window blur to avoid stuck modifier
    window.addEventListener('blur', () => {
      if (currentModifier !== 'DEFAULT') {
        applyPetalsState(defaultState, 'DEFAULT');
      }
    });
  </script>
</body>
</html>
