<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tangerine Radial Menu</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Base Layout: Full-screen, transparent background */
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 500x500 Main Viewport */
    .app-canvas {
      position: relative;
      width: 500px;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 380x380 Radial Flower Container */
    .radial-menu {
      position: relative;
      width: 380px;
      height: 380px;
      filter: drop-shadow(0 14px 34px rgba(0, 0, 0, 0.16));
    }

    /* 1. Apple Glass (Default): backdrop-filter: blur(30px) clipped to petals */
    .glass-petals-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 380px;
      height: 380px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      clip-path: url(#petals-clip);
      -webkit-clip-path: url(#petals-clip);
      pointer-events: none;
    }

    /* SVG Flower Petals Overlay (380x380) */
    .radial-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: auto;
    }

    /* 1. Brighter Glass Base: Glowing milky frosted glass rgba(255, 255, 255, 0.75) */
    /* 2. Edge Highlight: Crisp 1px stroke of rgba(255, 255, 255, 0.9) */
    .petal-slice {
      fill: rgba(255, 255, 255, 0.75);
      stroke: rgba(255, 255, 255, 0.9);
      stroke-width: 1px;
      cursor: pointer;
      transition: fill 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                  stroke 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.1));
    }

    /* 4. Tangerine Hover (Vibrant): Warm, glowing Tangerine Orange rgba(255, 100, 0, 0.8) */
    .petal-slice.active {
      fill: rgba(255, 100, 0, 0.8);
      stroke: rgba(255, 255, 255, 0.95);
      stroke-width: 1.5px;
      filter: drop-shadow(0 0 16px rgba(255, 100, 0, 0.75))
              drop-shadow(0 6px 20px rgba(255, 100, 0, 0.45));
    }

    /* 3. Text Contrast: Solid black (#000000) and bold inside unhovered petals */
    .segment-label {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      transition: fill 0.18s ease;
      filter: drop-shadow(0 1px 1px rgba(255, 255, 255, 0.8));
    }

    /* When petal is hovered in glowing Tangerine Orange, text turns crisp white */
    .segment-label.active {
      fill: #ffffff;
      font-weight: 900;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.45));
    }

    /* 2. The Center Pill: Frosted glass bubble inside the transparent center hole */
    .center-pill-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 30;
    }

    .center-pill-container.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .center-pill {
      padding: 7px 18px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 
        0 8px 24px rgba(0, 0, 0, 0.12),
        0 2px 8px rgba(255, 100, 0, 0.22),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      max-width: 136px;
    }

    .pill-category {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #ff6400;
      margin-bottom: 2px;
      line-height: 1;
    }

    .pill-action {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #111111;
      text-align: center;
      line-height: 1.15;
    }
  </style>
</head>
<body>
  <div class="app-canvas">
    <!-- 380x380 Flower Radial Menu -->
    <div class="radial-menu" id="radial-menu">
      <!-- 3. Apple Frosted Glass Backdrop (blur: 30px) clipped to the 8 petals -->
      <div class="glass-petals-backdrop"></div>

      <!-- 2. The Center Pill: Frosted glass bubble inside the transparent center hole -->
      <div class="center-pill-container" id="tooltip">
        <div class="center-pill">
          <div class="pill-category" id="tooltip-category">Convert to</div>
          <div class="pill-action" id="tooltip-text">PDF</div>
        </div>
      </div>

      <!-- SVG Flower Petals (380x380) -->
      <svg class="radial-svg" viewBox="0 0 380 380">
        <defs>
          <!-- ClipPath for 8 distinct rounded petals with visible gaps -->
          <clipPath id="petals-clip" clipPathUnits="userSpaceOnUse">
            <path d="M 146.18 11.29 A 184 184 0 0 1 233.82 11.29 A 14 14 0 0 1 243.76 29.33 L 217.10 109.00 A 10 10 0 0 1 205.57 115.61 A 76 76 0 0 0 174.43 115.61 A 10 10 0 0 1 162.90 109.00 L 136.24 29.33 A 14 14 0 0 1 146.18 11.29 Z M 285.38 32.65 A 184 184 0 0 1 347.35 94.62 A 14 14 0 0 1 341.62 114.40 L 266.44 151.89 A 10 10 0 0 1 253.61 148.41 A 76 76 0 0 0 231.59 126.39 A 10 10 0 0 1 228.11 113.56 L 265.60 38.38 A 14 14 0 0 1 285.38 32.65 Z M 368.71 146.18 A 184 184 0 0 1 368.71 233.82 A 14 14 0 0 1 350.67 243.76 L 271.00 217.10 A 10 10 0 0 1 264.39 205.57 A 76 76 0 0 0 264.39 174.43 A 10 10 0 0 1 271.00 162.90 L 350.67 136.24 A 14 14 0 0 1 368.71 146.18 Z M 347.35 285.38 A 184 184 0 0 1 285.38 347.35 A 14 14 0 0 1 265.60 341.62 L 228.11 266.44 A 10 10 0 0 1 231.59 253.61 A 76 76 0 0 0 253.61 231.59 A 10 10 0 0 1 266.44 228.11 L 341.62 265.60 A 14 14 0 0 1 347.35 285.38 Z M 233.82 368.71 A 184 184 0 0 1 146.18 368.71 A 14 14 0 0 1 136.24 350.67 L 162.90 271.00 A 10 10 0 0 1 174.43 264.39 A 76 76 0 0 0 205.57 264.39 A 10 10 0 0 1 217.10 271.00 L 243.76 350.67 A 14 14 0 0 1 233.82 368.71 Z M 94.62 347.35 A 184 184 0 0 1 32.65 285.38 A 14 14 0 0 1 38.38 265.60 L 113.56 228.11 A 10 10 0 0 1 126.39 231.59 A 76 76 0 0 0 148.41 253.61 A 10 10 0 0 1 151.89 266.44 L 114.40 341.62 A 14 14 0 0 1 94.62 347.35 Z M 11.29 233.82 A 184 184 0 0 1 11.29 146.18 A 14 14 0 0 1 29.33 136.24 L 109.00 162.90 A 10 10 0 0 1 115.61 174.43 A 76 76 0 0 0 115.61 205.57 A 10 10 0 0 1 109.00 217.10 L 29.33 243.76 A 14 14 0 0 1 11.29 233.82 Z M 32.65 94.62 A 184 184 0 0 1 94.62 32.65 A 14 14 0 0 1 114.40 38.38 L 151.89 113.56 A 10 10 0 0 1 148.41 126.39 A 76 76 0 0 0 126.39 148.41 A 10 10 0 0 1 113.56 151.89 L 38.38 114.40 A 14 14 0 0 1 32.65 94.62 Z" />
          </clipPath>
        </defs>

        <!-- 1. 8 Distinct, Separated Flower Petals with Visible Gaps & Rounded Corners -->
        <path id="slice-0" class="petal-slice" data-index="0" data-format="PDF" d="M 146.18 11.29 A 184 184 0 0 1 233.82 11.29 A 14 14 0 0 1 243.76 29.33 L 217.10 109.00 A 10 10 0 0 1 205.57 115.61 A 76 76 0 0 0 174.43 115.61 A 10 10 0 0 1 162.90 109.00 L 136.24 29.33 A 14 14 0 0 1 146.18 11.29 Z" />
        <path id="slice-1" class="petal-slice" data-index="1" data-format="JPG" d="M 285.38 32.65 A 184 184 0 0 1 347.35 94.62 A 14 14 0 0 1 341.62 114.40 L 266.44 151.89 A 10 10 0 0 1 253.61 148.41 A 76 76 0 0 0 231.59 126.39 A 10 10 0 0 1 228.11 113.56 L 265.60 38.38 A 14 14 0 0 1 285.38 32.65 Z" />
        <path id="slice-2" class="petal-slice" data-index="2" data-format="PNG" d="M 368.71 146.18 A 184 184 0 0 1 368.71 233.82 A 14 14 0 0 1 350.67 243.76 L 271.00 217.10 A 10 10 0 0 1 264.39 205.57 A 76 76 0 0 0 264.39 174.43 A 10 10 0 0 1 271.00 162.90 L 350.67 136.24 A 14 14 0 0 1 368.71 146.18 Z" />
        <path id="slice-3" class="petal-slice" data-index="3" data-format="WEBP" d="M 347.35 285.38 A 184 184 0 0 1 285.38 347.35 A 14 14 0 0 1 265.60 341.62 L 228.11 266.44 A 10 10 0 0 1 231.59 253.61 A 76 76 0 0 0 253.61 231.59 A 10 10 0 0 1 266.44 228.11 L 341.62 265.60 A 14 14 0 0 1 347.35 285.38 Z" />
        <path id="slice-4" class="petal-slice" data-index="4" data-format="HEIC" d="M 233.82 368.71 A 184 184 0 0 1 146.18 368.71 A 14 14 0 0 1 136.24 350.67 L 162.90 271.00 A 10 10 0 0 1 174.43 264.39 A 76 76 0 0 0 205.57 264.39 A 10 10 0 0 1 217.10 271.00 L 243.76 350.67 A 14 14 0 0 1 233.82 368.71 Z" />
        <path id="slice-5" class="petal-slice" data-index="5" data-format="TIFF" d="M 94.62 347.35 A 184 184 0 0 1 32.65 285.38 A 14 14 0 0 1 38.38 265.60 L 113.56 228.11 A 10 10 0 0 1 126.39 231.59 A 76 76 0 0 0 148.41 253.61 A 10 10 0 0 1 151.89 266.44 L 114.40 341.62 A 14 14 0 0 1 94.62 347.35 Z" />
        <path id="slice-6" class="petal-slice" data-index="6" data-format="AVIF" d="M 11.29 233.82 A 184 184 0 0 1 11.29 146.18 A 14 14 0 0 1 29.33 136.24 L 109.00 162.90 A 10 10 0 0 1 115.61 174.43 A 76 76 0 0 0 115.61 205.57 A 10 10 0 0 1 109.00 217.10 L 29.33 243.76 A 14 14 0 0 1 11.29 233.82 Z" />
        <path id="slice-7" class="petal-slice" data-index="7" data-format="BMP" d="M 32.65 94.62 A 184 184 0 0 1 94.62 32.65 A 14 14 0 0 1 114.40 38.38 L 151.89 113.56 A 10 10 0 0 1 148.41 126.39 A 76 76 0 0 0 126.39 148.41 A 10 10 0 0 1 113.56 151.89 L 38.38 114.40 A 14 14 0 0 1 32.65 94.62 Z" />

        <!-- Petal Labels: Centered in each petal (Rmid = 130px) -->
        <text id="label-0" class="segment-label" x="190.00" y="60.00">PDF</text>
        <text id="label-1" class="segment-label" x="281.92" y="98.08">JPG</text>
        <text id="label-2" class="segment-label" x="320.00" y="190.00">PNG</text>
        <text id="label-3" class="segment-label" x="281.92" y="281.92">WEBP</text>
        <text id="label-4" class="segment-label" x="190.00" y="320.00">HEIC</text>
        <text id="label-5" class="segment-label" x="98.08" y="281.92">TIFF</text>
        <text id="label-6" class="segment-label" x="60.00" y="190.00">AVIF</text>
        <text id="label-7" class="segment-label" x="98.08" y="98.08">BMP</text>
      </svg>
    </div>
  </div>

  <script>
    // 1. Menu Datasets
    const MENUS = {
      DEFAULT: ['PDF', 'JPG', 'PNG', 'WEBP', 'HEIC', 'TIFF', 'AVIF', 'BMP'],
      CTRL:    ['COMPRESS', 'METADATA', 'EDIT', 'REDACT', 'CROP', 'ADD BG', 'WATER', 'RESIZE'],
      SHIFT:   ['ENCRYPT', 'DECRYPT', 'MERGE', 'SPLIT', 'EXTRACT', 'ROTATE', 'FLIP', 'FILTER'],
      ALT:     ['TO ZIP', 'TO TAR', 'TO ISO', 'UNZIP', 'SEND', 'PRINT', 'DELETE', 'INFO']
    };

    let currentModifier = 'DEFAULT';
    let currentHoverIndex = -1;

    /**
     * Updates the center pill text dynamically based on the current active petal.
     */
    function updateTooltipText(index) {
      const label = document.getElementById(`label-${index}`);
      if (!label) return;
      const currentText = label.textContent.trim();
      const tooltipText = document.getElementById('tooltip-text');
      const tooltipCategory = document.getElementById('tooltip-category');

      if (tooltipText) {
        tooltipText.textContent = currentText;
      }
      if (tooltipCategory) {
        tooltipCategory.textContent = (currentModifier === 'DEFAULT') ? 'Convert to' : 'Action';
      }
    }

    /**
     * 2. JS Switching Logic: Dynamically updates the textContent of the 8 SVG text elements based on modifier array.
     * @param {string} modifier - 'DEFAULT' | 'CTRL' | 'SHIFT' | 'ALT'
     */
    window.switchMenu = function(modifier) {
      const mod = (modifier || 'DEFAULT').toUpperCase();
      const menuArray = MENUS[mod] || MENUS['DEFAULT'];
      currentModifier = mod;

      for (let i = 0; i < 8; i++) {
        const textEl = document.getElementById(`label-${i}`);
        if (textEl) {
          textEl.textContent = menuArray[i];
        }
        const sliceEl = document.getElementById(`slice-${i}`);
        if (sliceEl) {
          sliceEl.dataset.format = menuArray[i];
        }
      }

      // If a petal is currently hovered, immediately update the center action pill
      if (currentHoverIndex >= 0 && currentHoverIndex < 8) {
        updateTooltipText(currentHoverIndex);
      }
    };

    /**
     * Updates hover state, highlights active petal in glowing Tangerine Orange, and reveals center action pill.
     * @param {number} x - Cursor X coordinate (window space)
     * @param {number} y - Cursor Y coordinate (window space)
     */
    window.updateHover = function(x, y) {
      const menu = document.getElementById('radial-menu');
      if (!menu) return;

      const rect = menu.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const dx = x - cx;
      const dy = y - cy;
      const dist = Math.hypot(dx, dy);

      // Center hole: 76px radius | Outer edge: 184px radius
      if (dist < 76 || dist > 184) {
        window.clearHover();
        return;
      }

      // Calculate angle clockwise from 12 o'clock (North = 0 deg)
      const rad = Math.atan2(dy, dx);
      const deg = (rad * 180 / Math.PI + 90 + 360) % 360;
      const index = Math.floor(((deg + 22.5) % 360) / 45);

      if (index === currentHoverIndex) return;
      currentHoverIndex = index;

      // Update petal hover state (glowing Tangerine Orange)
      for (let i = 0; i < 8; i++) {
        const slice = document.getElementById(`slice-${i}`);
        const label = document.getElementById(`label-${i}`);
        if (i === index) {
          if (slice) slice.classList.add('active');
          if (label) label.classList.add('active');
        } else {
          if (slice) slice.classList.remove('active');
          if (label) label.classList.remove('active');
        }
      }

      // Show active action in glassy center pill
      updateTooltipText(index);
      const tooltip = document.getElementById('tooltip');
      if (tooltip) {
        tooltip.classList.add('visible');
      }
    };

    /**
     * Clears all petal highlights and hides the center action pill.
     */
    window.clearHover = function() {
      if (currentHoverIndex === -1) {
        const tooltip = document.getElementById('tooltip');
        if (tooltip) tooltip.classList.remove('visible');
        return;
      }

      currentHoverIndex = -1;

      for (let i = 0; i < 8; i++) {
        const slice = document.getElementById(`slice-${i}`);
        const label = document.getElementById(`label-${i}`);
        if (slice) slice.classList.remove('active');
        if (label) label.classList.remove('active');
      }

      const tooltip = document.getElementById('tooltip');
      if (tooltip) {
        tooltip.classList.remove('visible');
      }
    };

    // Standard in-page mouse event listeners for browser testing
    window.addEventListener('mousemove', (e) => {
      window.updateHover(e.clientX, e.clientY);
    });

    window.addEventListener('mouseleave', () => {
      window.clearHover();
    });

    // In-page keyboard modifier listeners for browser testing
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Control') window.switchMenu('CTRL');
      else if (e.key === 'Shift') window.switchMenu('SHIFT');
      else if (e.key === 'Alt') window.switchMenu('ALT');
    });

    window.addEventListener('keyup', (e) => {
      if (e.ctrlKey) window.switchMenu('CTRL');
      else if (e.shiftKey) window.switchMenu('SHIFT');
      else if (e.altKey) window.switchMenu('ALT');
      else window.switchMenu('DEFAULT');
    });
  </script>
</body>
</html>
