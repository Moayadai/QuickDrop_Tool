<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tangerine Radial Menu</title>
  <!-- Premium Icon Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="qwebchannel.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --tangerine: #FF7A00;
      --tangerine-hover: #FF8F1F;
      --tangerine-glow: rgba(255, 122, 0, 0.5);
      --text-dark: #333333;
    }

    /* Base Reset & Transparent Window */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 500x500 Main Viewport */
    .app-canvas {
      position: relative;
      width: 500px;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
    }

    .app-canvas:active {
      cursor: grabbing;
    }

    /* ── Top Buttons: Light Frosted Glass ── */

    /* Close Window Button (Top-Left) */
    .close-app-btn {
      position: absolute;
      top: 20px;
      left: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      backdrop-filter: blur(30px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(30px) saturate(180%) !important;
      background: rgba(255, 255, 255, 0.65) !important;
      border: 1px solid rgba(255, 255, 255, 0.8) !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.9);
      color: #333333 !important;
      cursor: pointer;
      z-index: 100;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform, background-color, box-shadow;
    }

    .close-app-btn:hover {
      transform: scale(1.08);
      background: rgba(255, 59, 48, 0.9) !important;
      border-color: rgba(255, 255, 255, 0.8) !important;
      color: #ffffff !important;
      box-shadow: 0 6px 18px rgba(255, 59, 48, 0.4) !important;
    }

    .close-app-btn:active {
      transform: scale(0.92) !important;
      transition: transform 0.08s ease !important;
    }

    .close-app-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      fill: none;
    }

    /* FLOAT Pin to Top Tool Button (Top-Right) */
    .float-pin-btn {
      position: absolute;
      top: 20px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 18px;
      backdrop-filter: blur(30px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(30px) saturate(180%) !important;
      background: rgba(255, 255, 255, 0.65) !important;
      border: 1px solid rgba(255, 255, 255, 0.8) !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.9);
      color: #333333 !important;
      font-family: inherit;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.5px;
      cursor: pointer;
      z-index: 100;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform, box-shadow, background-color, color;
    }

    .float-pin-btn.active,
    .float-active {
      background: rgba(255, 255, 255, 0.8) !important;
      border-color: rgba(255, 122, 0, 0.5) !important;
      color: #FF7A00 !important;
      box-shadow: 0 4px 14px rgba(255, 122, 0, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.9) !important;
    }

    .float-pin-btn.active svg,
    .float-active svg {
      fill: #FF7A00 !important;
    }

    .float-pin-btn:hover {
      transform: scale(1.05) translateY(-1px);
      background: #FF7A00 !important;
      border-color: rgba(255, 255, 255, 0.8) !important;
      color: #ffffff !important;
      box-shadow: 0 6px 20px rgba(255, 122, 0, 0.45) !important;
    }

    .float-pin-btn:hover svg {
      fill: #ffffff !important;
    }

    .float-pin-btn:active {
      transform: scale(0.95) translateY(1px) !important;
      transition: transform 0.08s ease !important;
    }

    .float-pin-btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
      transition: fill 0.18s ease;
    }

    /* ── Light Frosted Glass Outer Container (380x380) ── */
    .main-container, .radial-menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1) !important;
      backdrop-filter: blur(40px) saturate(150%) !important;
      -webkit-backdrop-filter: blur(40px) saturate(150%) !important;
      -webkit-mask: radial-gradient(circle, transparent 0px, transparent 86px, black 87px);
      mask: radial-gradient(circle, transparent 0px, transparent 86px, black 87px);
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1), 0 4px 16px rgba(0, 0, 0, 0.04) !important;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }

    .radial-menu:active {
      cursor: grabbing;
    }

    /* SVG Radial Canvas */
    .radial-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      pointer-events: auto;
      z-index: 10;
    }

    /* Petal Group */
    .petal-group {
      transform-origin: 190px 190px;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
                  filter 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform, filter;
      cursor: pointer;
    }

    /* Donut-Style Organic Rounded Cards (Curved Floating Buttons) */
    .petal-slice {
      fill: rgba(255, 255, 255, 0.75) !important;
      background: rgba(255, 255, 255, 0.75) !important;
      stroke: transparent !important;
      stroke-width: 14px !important;
      stroke-linejoin: round !important;
      cursor: pointer;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.04));
      transition: fill 0.15s ease, filter 0.15s ease;
      will-change: fill, filter;
    }

    /* Hover State: Vibrant Tangerine Orange (#FF7A00) with White Text */
    .petal-group:hover,
    .petal-group.active {
      transform: scale(1.05);
      filter: drop-shadow(0 8px 24px rgba(255, 122, 0, 0.55));
    }

    .petal-group:active {
      transform: scale(0.98) !important;
      transition: transform 0.08s ease !important;
    }

    .petal-group:hover .petal-slice,
    .petal-group.active .petal-slice {
      fill: #FF7A00 !important;
      stroke: transparent !important;
      stroke-width: 14px !important;
    }

    /* ── Petal Content Layout (Flexbox: Icon on top, Text on bottom) ── */
    .petal-foreign {
      overflow: visible;
      pointer-events: none;
    }

    .petal-content {
      width: 100%;
      height: 100%;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 4px !important;
      pointer-events: none;
      user-select: none;
    }

    /* High-Contrast Dark Charcoal Labels (#333333) */
    .segment-label {
      font-size: 11px !important;
      font-weight: 750 !important;
      letter-spacing: 0.35px !important;
      color: #333333 !important;
      text-align: center;
      line-height: 1;
      pointer-events: none;
      transition: color 0.15s ease;
      will-change: color;
    }

    .segment-label.small-text {
      font-size: 9.5px !important;
      letter-spacing: 0.2px !important;
    }

    .petal-group:hover .segment-label,
    .petal-group.active .segment-label {
      color: #ffffff !important;
      font-weight: 800 !important;
    }

    /* High-Contrast Dark Charcoal Icons (#333333) */
    .petal-icon {
      width: 20px;
      height: 20px;
      pointer-events: none;
      color: #333333 !important;
      stroke: #333333 !important;
      fill: none !important;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 1 !important;
      transition: color 0.15s ease, stroke 0.15s ease;
      will-change: color, stroke;
    }

    .petal-group:hover .petal-icon,
    .petal-group.active .petal-icon {
      color: #ffffff !important;
      stroke: #ffffff !important;
    }

    /* ── Center Cavity: Completely Invisible with Floating Translucent Text Pill ── */
    .center-circle, #tooltip {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: transparent !important;
      fill: transparent !important;
      border: none !important;
      box-shadow: none !important;
      outline: none !important;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 30;
      padding: 0;
      text-align: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform;
    }

    .center-circle.active, #tooltip.active {
      transform: translate(-50%, -50%) !important;
    }

    body.dragging-file .center-circle,
    body.dragging-file #tooltip {
      transform: translate(-50%, -50%) !important;
    }

    /* Floating Text Pill/Capsule Shape */
    .center-action-label, #tooltip-text {
      background: rgba(255, 255, 255, 0.7) !important;
      padding: 8px 24px !important;
      border-radius: 50px !important;
      color: #333333 !important;
      font-weight: 800 !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15) !important;
      backdrop-filter: blur(10px) !important;
      -webkit-backdrop-filter: blur(10px) !important;
      border: 1px solid rgba(255, 255, 255, 0.5) !important;
      font-size: 14px !important;
      letter-spacing: 0.5px !important;
      text-transform: uppercase !important;
      line-height: 1 !important;
      text-align: center !important;
      white-space: nowrap !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-shadow: none !important;
      -webkit-text-stroke: 0 !important;
      filter: none !important;
      -webkit-font-smoothing: antialiased !important;
      -moz-osx-font-smoothing: grayscale !important;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    /* Sharp Tangerine Center Text: Solid color, zero blur, zero glow */
    .center-circle.active .center-action-label,
    #tooltip.active #tooltip-text {
      color: #FF7A00 !important;
      text-shadow: none !important;
      filter: none !important;
      -webkit-font-smoothing: antialiased !important;
      -moz-osx-font-smoothing: grayscale !important;
      font-weight: 800 !important;
      border-color: rgba(255, 122, 0, 0.6) !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15) !important;
    }

    /* Hidden elements kept for PyQt6 compatibility */
    .pill-category {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="app-canvas">
    <!-- Close Window Button (Light Frosted Circle) -->
    <button id="close-app-btn" class="close-app-btn" title="Close QuickDrop" aria-label="Close QuickDrop" onclick="triggerActionIfApplicable('CLOSE')">
      <svg viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <!-- FLOAT Pin to Top Toggle Button (Light Frosted Pill) -->
    <button id="float-pin-btn" class="float-pin-btn active float-active" title="Pinned to Top (Click to unpin)" aria-pressed="true" onclick="triggerActionIfApplicable('FLOAT')">
      <svg viewBox="0 0 24 24">
        <path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6l1 1 1-1v-6H18v-2l-2-2z"/>
      </svg>
      <span id="float-pin-label">FLOAT</span>
    </button>

    <!-- Main Radial Menu Container (Light Frosted Glass: rgba(255, 255, 255, 0.1)) -->
    <div class="radial-menu main-container" id="radial-menu">
      <!-- SVG Radial Ring with 8 Donut-Style Organic Rounded Cards -->
      <svg class="radial-svg" viewBox="0 0 380 380">
        <defs>
          <!-- ── State 1: File Formats Icons ── -->
          <symbol id="icon-pdf" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
            <polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
            <path d="M9 13v4m0-4h2a1.5 1.5 0 0 1 0 3H9m5-3v4m0-4h1.5a2 2 0 0 1 0 4H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          </symbol>

          <symbol id="icon-jpg" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="3.5" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
            <path d="M4 18l5-5 3 3 4-4 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </symbol>

          <symbol id="icon-png" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="3.5" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
            <polyline points="21 15 16 10 5 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </symbol>

          <symbol id="icon-docx" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
            <polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
            <line x1="8" y1="13" x2="16" y2="13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="8" y1="17" x2="14" y2="17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </symbol>

          <symbol id="icon-webp" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="1.5"/>
            <ellipse cx="12" cy="12" rx="4.5" ry="9" stroke="currentColor" stroke-width="1.5" fill="none"/>
          </symbol>

          <symbol id="icon-heic" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.6" fill="none"/>
            <line x1="12" y1="3" x2="12" y2="6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="12" y1="18" x2="12" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="3" y1="12" x2="6" y2="12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="18" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </symbol>

          <symbol id="icon-tiff" viewBox="0 0 24 24">
            <polygon points="12 2 2 7 12 12 22 7 12 2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
            <polyline points="2 12 12 17 22 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
            <polyline points="2 17 12 22 22 17" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
          </symbol>

          <symbol id="icon-avif" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="3.5" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <path d="M12 7l1.5 3.5L17 12l-3.5 1.5L12 17l-1.5-3.5L7 12l3.5-1.5z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
          </symbol>

          <!-- ── State 2: Action Tools Icons ── -->
          <symbol id="icon-crop" viewBox="0 0 24 24">
            <path d="M6 2v14a2 2 0 0 0 2 2h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M18 22V8a2 2 0 0 0-2-2H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

          <symbol id="icon-compress" viewBox="0 0 24 24">

            <path d="M12 3v6m0 0l-3.5-3.5m3.5 3.5l3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M12 21v-6m0 0l-3.5 3.5m3.5-3.5l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </symbol>

          <symbol id="icon-redact" viewBox="0 0 24 24">
            <rect x="3" y="6" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <line x1="6" y1="12" x2="18" y2="12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </symbol>

          <symbol id="icon-add-bg" viewBox="0 0 24 24">
            <rect x="3" y="5" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <circle cx="7" cy="9" r="1.2" fill="currentColor"/>
            <path d="M3 14l3.5-3 2.5 2 3-3 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M19 3v6 M16 6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>

          <symbol id="icon-edit" viewBox="0 0 24 24">

          </symbol>

          <symbol id="icon-annotate" viewBox="0 0 24 24">
            <path d="M12 20h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          </symbol>

          <symbol id="icon-metadata" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <line x1="12" y1="8" x2="12" y2="8.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <line x1="12" y1="12" x2="12" y2="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </symbol>

          <symbol id="icon-watermark" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <path d="M8 15l2.5-6 1.5 3.5 1.5-3.5L16 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          </symbol>

          <!-- ── State 3: Utility Tools Icons ── -->
          <symbol id="icon-ai-detect" viewBox="0 0 24 24">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <path d="M12 6l1.5 3.5L17 11l-3.5 1.5L12 16l-1.5-3.5L7 11l3.5-1.5z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
          </symbol>

          <symbol id="icon-ocr" viewBox="0 0 24 24">
            <path d="M4 8V5a1 1 0 0 1 1-1h3 M16 4h3a1 1 0 0 1 1 1v3 M4 16v3a1 1 0 0 0 1 1h3 M16 20h3a1 1 0 0 0 1-1v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <path d="M9 10h6 M12 10v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          </symbol>

          <symbol id="icon-translate" viewBox="0 0 24 24">
            <path d="M5 8l4 8 M9 8L5 16 M4 14h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            <path d="M14 6h7 M17.5 6v3 M14 9c1 3 3 5 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            <path d="M16 13c1.5 1.5 3 2.5 4.5 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          </symbol>

          <symbol id="icon-terminal" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <polyline points="7 9 11 12 7 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <script>
    // Global variables accessible by Python dropEvent / QWebChannel
    window.currentHoveredAction = null;
    window.isProcessing = false;
    window.isFloating = true;
    window.isKeepAwake = false;

    /**
     * Updates the UI visual state of the FLOAT button.
     */
    function updateFloatVisualState() {
      const pinBtn = document.getElementById('float-pin-btn');
      if (pinBtn) {
        if (window.isFloating) {
          pinBtn.classList.add('active', 'float-active');
          pinBtn.setAttribute('title', 'Pinned to Top (Click to unpin)');
          pinBtn.setAttribute('aria-pressed', 'true');
        } else {
          pinBtn.classList.remove('active', 'float-active');
          pinBtn.setAttribute('title', 'Click to Pin to Top');
          pinBtn.setAttribute('aria-pressed', 'false');
        }
      }
    }

    window.setFloatState = function(floating) {
      window.isFloating = Boolean(floating);
      updateFloatVisualState();
    };

    window.setKeepAwakeState = function(awake) {
      window.isKeepAwake = Boolean(awake);
    };

    // ── Tangerine 3 Persistent States ──

    // State 1: File Formats (Toggle with Control)
    const STATE_1_FORMATS = [
      "PDF", "JPG", "PNG", "DOCX", "WEBP", "HEIC", "TIFF", "AVIF"
    ];

    // State 2: Action Tools (Toggle with Shift)
    const STATE_2_TOOLS = [
      "CROP", "COMPRESS", "REDACT", "ADD BG", "EDIT", "ANNOTATE", "METADATA", "WATERMARK"
    ];

    // State 3: Utility Tools (Toggle with Space)
    const STATE_3_UTILITIES = [
      "AI DETECT", "OCR", "TRANSLATE", "TERMINAL", "TIMER", "RECORD", "CALC", "AIRDROP"
    ];

    // Action-to-Icon identifier dictionary
    const ACTION_ICONS = {
      // State 1: Formats
      "PDF": "icon-pdf",
      "JPG": "icon-jpg",
      "PNG": "icon-png",
      "DOCX": "icon-docx",
      "WEBP": "icon-webp",
      "HEIC": "icon-heic",
      "TIFF": "icon-tiff",
      "AVIF": "icon-avif",

      // State 2: Action Tools
      "CROP": "icon-crop",
      "COMPRESS": "icon-compress",
      "REDACT": "icon-redact",
      "ADD BG": "icon-add-bg",
      "EDIT": "icon-edit",
      "ANNOTATE": "icon-annotate",
      "METADATA": "icon-metadata",
      "WATERMARK": "icon-watermark",

      // State 3: Utility Tools
      "AI DETECT": "icon-ai-detect",
      "OCR": "icon-ocr",
      "TRANSLATE": "icon-translate",
      "TERMINAL": "icon-terminal",
      "TIMER": "icon-timer",
      "RECORD": "icon-record",
      "CALC": "icon-calc",
      "AIRDROP": "icon-airdrop",
      "SHARE": "icon-airdrop"
    };

    let currentState = 1; // 1 | 2 | 3 (strictly persistent)
    let currentHoverIndex = -1;
    let isFileDragging = false;

    /**
     * Gets the active array of actions for the current locked state.
     */
    function getCurrentStateArray() {
      if (currentState === 1) return STATE_1_FORMATS;
      if (currentState === 2) return STATE_2_TOOLS;
      if (currentState === 3) return STATE_3_UTILITIES;
      return STATE_1_FORMATS;
    }

    /**
     * Updates petal text, data-format, and icon across all 8 slices.
     * @param {string[]} stateArray - Array of 8 action strings
     */
    function applyPetalsState(stateArray) {
      for (let index = 0; index < 8; index++) {
        const action = stateArray[index];
        const slice = document.getElementById(`slice-${index}`);
        const label = document.getElementById(`label-${index}`);
        const iconUse = document.getElementById(`icon-use-${index}`);

        if (slice) {
          slice.setAttribute('data-format', action);
          slice.dataset.format = action;
        }

        if (label) {
          label.textContent = action;
          if (action.length > 7) {
            label.classList.add('small-text');
          } else {
            label.classList.remove('small-text');
          }
        }

        if (iconUse) {
          const iconId = ACTION_ICONS[action] || 'icon-pdf';
          iconUse.setAttribute('href', `#${iconId}`);
          iconUse.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', `#${iconId}`);
        }
      }

      // Refresh center circle text if hovering a slice
      if (currentHoverIndex >= 0 && currentHoverIndex < 8) {
        updateTooltipContent(currentHoverIndex);
      } else {
        resetCenterCircle();
      }
    }

    /**
     * Resets the center circle to default idle state (shows the current state default action).
     */
    function resetCenterCircle() {
      if (window.isProcessing) return;
      const centerLabel = document.getElementById('tooltip-text');
      const tooltip = document.getElementById('tooltip');

      if (centerLabel) {
        const currentArray = getCurrentStateArray();
        centerLabel.textContent = currentArray[0] || 'PDF';
      }
      if (tooltip) {
        tooltip.classList.remove('active');
      }
    }

    /**
     * Dynamically displays the hovered action/format in the center donut hole.
     * @param {number} index
     */
    function updateTooltipContent(index) {
      if (window.isProcessing) return;
      const currentArray = getCurrentStateArray();
      const action = currentArray[index];
      if (!action) {
        window.currentHoveredAction = null;
        return;
      }

      window.currentHoveredAction = action;

      const centerLabel = document.getElementById('tooltip-text');
      const tooltip = document.getElementById('tooltip');

      if (centerLabel) {
        centerLabel.textContent = action;
      }

      if (tooltip) {
        tooltip.classList.add('active');
      }
    }

    // ── Tactile Acoustic Feedback (Web Audio API) ──
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    ['mousedown', 'mousemove', 'keydown', 'touchstart'].forEach((evt) => {
      window.addEventListener(evt, () => {
        try {
          const ctx = getAudioContext();
          if (ctx && ctx.state === 'suspended') ctx.resume();
        } catch (_) {}
      }, { once: true, passive: true });
    });

    function playDialTick() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        if (ctx.state === 'suspended') ctx.resume();

        const t = ctx.currentTime;
        const oscClick = ctx.createOscillator();
        const gainClick = ctx.createGain();
        oscClick.type = 'triangle';
        oscClick.frequency.setValueAtTime(2600, t);
        oscClick.frequency.exponentialRampToValueAtTime(750, t + 0.008);

        gainClick.gain.setValueAtTime(0.04, t);
        gainClick.gain.exponentialRampToValueAtTime(0.0001, t + 0.008);

        oscClick.connect(gainClick);
        gainClick.connect(ctx.destination);
        oscClick.start(t);
        oscClick.stop(t + 0.009);
      } catch (_) {}
    }

    /**
     * Activates a petal with scale and vibrant Tangerine highlight.
     * @param {number} index
     */
    function setActivePetal(index) {
      if (index === currentHoverIndex) return;
      if (index >= 0 && index < 8) {
        playDialTick();
      }
      currentHoverIndex = index;

      for (let i = 0; i < 8; i++) {
        const group = document.getElementById(`petal-group-${i}`);
        const slice = document.getElementById(`slice-${i}`);
        if (i === index) {
          if (group) group.classList.add('active');
          if (slice) slice.classList.add('active');
        } else {
          if (group) group.classList.remove('active');
          if (slice) slice.classList.remove('active');
        }
      }

      updateTooltipContent(index);
    }

    /**
     * Updates hover state across the 8 sectors.
     * @param {number} x - Cursor X coordinate (window space)
     * @param {number} y - Cursor Y coordinate (window space)
     */
    window.updateHover = function(x, y) {
      const menu = document.getElementById('radial-menu');
      if (!menu) return;

      const rect = menu.getBoundingClientRect();
      const cx = rect.width ? (rect.left + rect.width / 2) : (window.innerWidth / 2 || 250);
      const cy = rect.height ? (rect.top + rect.height / 2) : (window.innerHeight / 2 || 250);

      const dx = x - cx;
      const dy = y - cy;
      const dist = Math.hypot(dx, dy);

      // Cards span from r=88px to r=184px (leaving breathing gap to container wall)
      if (dist < 85 || dist > 185) {
        window.clearHover();
        return;
      }

      // Calculate angle clockwise from 12 o'clock (North = 0 deg)
      const rad = Math.atan2(dy, dx);
      const deg = (rad * 180 / Math.PI + 90 + 360) % 360;

      // 8 sectors (45 deg each, centered at 0, 45, 90, 135, 180, 225, 270, 315 deg)
      const index = Math.floor(((deg + 22.5) % 360) / 45);

      setActivePetal(index);
    };

    /**
     * Clears all petal highlights and resets center hub.
     */
    window.clearHover = function() {
      window.currentHoveredAction = null;
      if (currentHoverIndex === -1) return;
      currentHoverIndex = -1;

      for (let i = 0; i < 8; i++) {
        const group = document.getElementById(`petal-group-${i}`);
        const slice = document.getElementById(`slice-${i}`);
        if (group) group.classList.remove('active');
        if (slice) slice.classList.remove('active');
      }

      resetCenterCircle();
    };

    // ── Strictly Toggle / Persistent Key Logic (NO HOLD, NO RESET ON RELEASE) ──

    /**
     * Locks in one of the 3 states. State persists until another toggle key is pressed.
     * @param {number} stateNum - 1 | 2 | 3
     */
    function setRadialState(stateNum) {
      if (stateNum < 1 || stateNum > 3) return;
      currentState = stateNum;

      let targetArray;
      if (stateNum === 1) targetArray = STATE_1_FORMATS;
      else if (stateNum === 2) targetArray = STATE_2_TOOLS;
      else if (stateNum === 3) targetArray = STATE_3_UTILITIES;

      applyPetalsState(targetArray);

      const centerLabel = document.getElementById('tooltip-text');
      if (centerLabel && !window.currentHoveredAction && !window.isProcessing) {
        centerLabel.textContent = targetArray[0];
      }
    }

    /**
     * Keydown mapping:
     * - Control -> State 1 (File Formats)
     * - Shift   -> State 2 (Action Tools)
     * - Space   -> State 3 (Utility Tools) [with e.preventDefault() to avoid scrolling]
     */
    function handleKeyDown(e) {
      if (e.key === 'Control') {
        setRadialState(1);
      } else if (e.key === 'Shift') {
        setRadialState(2);
      } else if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        setRadialState(3);
      }
    }

    window.addEventListener('keydown', handleKeyDown, true);
    document.addEventListener('keydown', handleKeyDown, true);

    /**
     * Window / backend API called by Python TransparentWebDropZone._sync_modifier.
     */
    window.switchMenu = function(modifier, force) {
      const mod = (modifier || '').toUpperCase();
      if (mod === 'CTRL' || mod === 'CONTROL' || mod === 'STATE1') {
        setRadialState(1);
      } else if (mod === 'SHIFT' || mod === 'STATE2') {
        setRadialState(2);
      } else if (mod === 'SPACE' || mod === 'UTILITY' || mod === 'STATE3') {
        setRadialState(3);
      }
    };

    window.addEventListener('mousemove', (e) => {
      if (!isDraggingWindow) {
        window.updateHover(e.clientX, e.clientY);
      }
    }, { passive: true });

    window.addEventListener('mouseleave', () => {
      window.clearHover();
    });

    // ── QWebChannel Bridge to Python Backend ──
    var backend = null;
    window.backend = null;
    function initWebChannel() {
      if (window.backend) return;
      if (typeof QWebChannel !== 'undefined' && typeof qt !== 'undefined' && qt.webChannelTransport) {
        new QWebChannel(qt.webChannelTransport, function(channel) {
          backend = channel.objects.backend || channel.objects.bridge;
          window.backend = backend;
          window.bridge = backend;
          console.log("[QuickDrop] QWebChannel connected to Python backend successfully.");
        });
      } else {
        setTimeout(initWebChannel, 50);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initWebChannel);
    } else {
      initWebChannel();
    }

    let lastActionDispatchTime = 0;

    /**
     * Dispatches action execution to Python backend on click without requiring file drop.
     * @param {string} action
     */
    function triggerActionIfApplicable(action) {
      if (!action) return;
      const now = Date.now();
      if (now - lastActionDispatchTime < 350) return;
      lastActionDispatchTime = now;

      const act = action.trim().toUpperCase();

      if (act === 'CLOSE' || act === 'QUIT' || act === 'EXIT') {
        const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
        if (b && typeof b.close_app === 'function') {
          b.close_app();
        } else {
          document.title = 'quickdrop:action:CLOSE:' + Date.now();
        }
        return;
      }

      if (act.startsWith('FLOAT') || act === 'PIN') {
        const nextState = !window.isFloating;
        window.isFloating = nextState;
        updateFloatVisualState();

        const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
        if (b && typeof b.toggle_float_on_top === 'function') {
          b.toggle_float_on_top(Boolean(nextState));
        } else if (b && typeof b.trigger_action === 'function') {
          b.trigger_action(act);
        } else {
          document.title = 'quickdrop:action:FLOAT:' + (nextState ? '1' : '0') + ':' + Date.now();
        }
        return;
      }

      const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
      if (b && typeof b.open_file_dialog === 'function') {
        b.open_file_dialog(act);
      } else if (b && typeof b.trigger_action === 'function') {
        b.trigger_action(act);
      } else {
        document.title = 'quickdrop:action:' + act + ':' + Date.now();
      }
    }
    window.triggerAction = triggerActionIfApplicable;

    // Polyfill .click() on SVG elements
    if (typeof SVGElement !== 'undefined' && !SVGElement.prototype.click) {
      SVGElement.prototype.click = function() {
        this.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
      };
    }

    // ── Window Dragging Bridge (JS to Python) ──
    let isDraggingWindow = false;

    document.addEventListener('mousedown', (e) => {
      const isInteractive = e.target.closest('button') ||
                            e.target.closest('.action-btn') ||
                            e.target.closest('.petal-group') ||
                            e.target.closest('.petal-slice') ||
                            e.target.closest('.petal') ||
                            e.target.closest('.segment-label') ||
                            e.target.closest('.petal-icon') ||
                            e.target.closest('.petal-foreign') ||
                            e.target.closest('#tooltip');
      if (!isInteractive) {
        isDraggingWindow = true;
        const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
        if (b && b.start_drag) {
          b.start_drag();
        }
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (isDraggingWindow) {
        const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
        if (b && b.do_drag) {
          b.do_drag();
        }
      }
    });

    document.addEventListener('mouseup', () => { 
      if (isDraggingWindow) {
        isDraggingWindow = false;
        const b = window.backend || (typeof backend !== 'undefined' ? backend : null);
        if (b && b.stop_drag) {
          b.stop_drag();
        }
      }
    });

    // Petal interactive click & hover handlers
    for (let i = 0; i < 8; i++) {
      const group = document.getElementById(`petal-group-${i}`);
      const handlePetalClick = (e) => {
        if (e) {
          if (e.stopPropagation) e.stopPropagation();
          if (e.preventDefault) e.preventDefault();
        }
        if (isDraggingWindow) return;
        const sliceEl = document.getElementById(`slice-${i}`);
        const label = document.getElementById(`label-${i}`);
        const action = (sliceEl ? (sliceEl.dataset.format || sliceEl.getAttribute('data-format')) : '')
                      || (label ? label.textContent.trim() : '')
                      || window.currentHoveredAction;
        if (!action) return;
        triggerActionIfApplicable(action);
      };

      if (group) {
        group.addEventListener('mouseenter', () => setActivePetal(i));
        group.addEventListener('click', handlePetalClick);
      }
    }

    const radialMenuEl = document.getElementById('radial-menu');
    if (radialMenuEl) {
      radialMenuEl.addEventListener('click', (e) => {
        if (isDraggingWindow) return;
        if (e.target === radialMenuEl && window.currentHoveredAction) {
          triggerActionIfApplicable(window.currentHoveredAction);
        }
      });
    }

    // ── Drag & Drop Event Listeners ──
    const handleDragEnter = (e) => {
      e.preventDefault();
      isFileDragging = true;
      document.body.classList.add('dragging-file');
      if (e.dataTransfer) {
        e.dataTransfer.dropEffect = 'copy';
      }
    };

    const handleDragOver = (e) => {
      e.preventDefault();
      isFileDragging = true;
      document.body.classList.add('dragging-file');
      if (e.dataTransfer) {
        e.dataTransfer.dropEffect = 'copy';
      }
      if (e.clientX !== undefined && e.clientY !== undefined) {
        window.updateHover(e.clientX, e.clientY);
      }
    };

    const handleDragLeave = (e) => {
      e.preventDefault();
      if (!e.relatedTarget || e.clientX <= 0 || e.clientY <= 0 || e.clientX >= window.innerWidth || e.clientY >= window.innerHeight) {
        isFileDragging = false;
        document.body.classList.remove('dragging-file');
        window.clearHover();
      }
    };

    const handleDrop = (e) => {
      e.preventDefault();
      isFileDragging = false;
      document.body.classList.remove('dragging-file');
      window.clearHover();
    };

    window.addEventListener('dragenter', handleDragEnter, false);
    window.addEventListener('dragover', handleDragOver, false);
    window.addEventListener('dragleave', handleDragLeave, false);
    window.addEventListener('drop', handleDrop, false);

    document.addEventListener('dragenter', handleDragEnter, false);
    document.addEventListener('dragover', handleDragOver, false);
    document.addEventListener('dragleave', handleDragLeave, false);
    document.addEventListener('drop', handleDrop, false);
  </script>
</body>
</html>
